<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f1ee" />
  <title>Clientes | ObraMate</title>
  <script src="om-device.js?v=20260925-device1"></script>
  <script>
    (function () {
      if (window.__omDevice && window.__omDevice.guardMobileOnlyPage("dashboard.html?page=customers")) return;
    })();
  </script>
  <style id="om-chrome-critical">html{--plab-rail:72px;--crm-sidebar-expanded-width:232px}body.om-app.dashboard-app-body{--crm-topbar-height:56px;--crm-sidebar-width:var(--crm-sidebar-expanded-width,232px)}</style>
  <link rel="icon" type="image/png" href="/assets/favicon-192.png?v=20260924-pwa" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260924-omapp" />
  <link rel="stylesheet" href="design-system.css?v=20260923-chrome" />
  <link rel="stylesheet" href="crm-toast.css" />
  <link rel="stylesheet" href="crm-shell.css?v=20260925-apptop1" />
  <link rel="stylesheet" href="crm-shared-nav.css?v=12" />
  <link rel="stylesheet" href="obramate-app.css?v=20260925-apptop1" />
  <link rel="stylesheet" href="om-mobile-nav.css?v=20260925-apptop1" />
  <link rel="stylesheet" href="jobs-customers-mobile.css?v=20260925-jcm1" />
</head>
<body class="dashboard-app-body om-app sidebar-collapsed cli-app">
  <script>
    (function () {
      try {
        if (localStorage.getItem("crm_sidebar_collapsed") === "0") document.body.classList.remove("sidebar-collapsed");
      } catch (e) {}
      if (window.__omDevice && window.__omDevice.applyBodyClass) window.__omDevice.applyBodyClass();
    })();
  </script>

  <header class="mobile-app-header" id="mobileAppHeader">
    <button type="button" class="mobile-app-header__menu" id="mobileMenuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="dashboardSidebar">
      <span class="mobile-app-header__menu-icon" aria-hidden="true"></span>
    </button>
    <div class="mobile-app-header__brand">
      <h1 class="mobile-app-header__title">Clientes</h1>
    </div>
  </header>

  <div class="dashboard-container">
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <img src="/assets/favicon-192.png?v=20260924-pwa" alt="ObraMate" class="sidebar-brand-logo crm-system-logo" width="32" height="32" onerror="this.style.display='none'" />
        <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-pressed="true" aria-label="Expandir menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="Principal"><div id="crmSharedNavRoot" data-layout="sidebar"></div></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-bar">
          <div class="sidebar-user-bar__avatar" id="sidebarUserAvatar">—</div>
          <div class="sidebar-user-bar__text">
            <span class="sidebar-user-bar__name" id="sidebarUserName">—</span>
            <span class="sidebar-user-bar__role" id="sidebarUserRole"></span>
          </div>
          <button type="button" id="logoutBtn" class="sidebar-logout-btn" aria-label="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <main class="dashboard-main">
      <div class="cli-desktop" hidden></div>
      <div class="jcm" id="cliMobile">
        <!-- List -->
        <div class="jcm-pane" id="cliListPane">
          <div class="jcm-nav">
            <a class="jcm-icon-btn" href="mais.html" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
            <button type="button" class="jcm-icon-btn jcm-icon-btn--accent" id="cliAddBtn" data-crm-permission="customers.create" aria-label="Novo cliente">
              <svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            </button>
          </div>
          <h1 class="jcm-title">Clientes</h1>
          <p class="jcm-sub" id="cliSummary">—</p>
          <label class="jcm-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" id="cliSearch" placeholder="Nome, endereço ou telefone" autocomplete="off" />
          </label>
          <div class="jcm-chips" id="cliChips"></div>
          <div class="jcm-list" id="cliList"></div>
        </div>

        <!-- Detail -->
        <div class="jcm-pane" id="cliDetailPane" hidden>
          <div class="jcm-nav">
            <button type="button" class="jcm-icon-btn" id="cliDetailBack" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
            <strong style="font-size:1rem;font-weight:800">Cliente</strong>
            <button type="button" class="jcm-icon-btn" id="cliEditBtn" aria-label="Editar"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
          </div>
          <div class="jcm-profile">
            <span class="jcm-profile__av" id="cliDetAv">—</span>
            <h1 class="jcm-profile__name" id="cliDetName">—</h1>
            <div class="jcm-profile__row">
              <span class="jcm-badge jcm-badge--builder" id="cliDetType">—</span>
              <span class="jcm-profile__since" id="cliDetSince">—</span>
            </div>
          </div>
          <div class="jcm-quick" id="cliQuick"></div>
          <div class="jcm-kpis">
            <div class="jcm-kpi"><p class="jcm-kpi__label">Contratado</p><p class="jcm-kpi__val" id="cliKpiContracted">—</p></div>
            <div class="jcm-kpi"><p class="jcm-kpi__label">Recebido</p><p class="jcm-kpi__val" id="cliKpiPaid">—</p></div>
            <div class="jcm-kpi jcm-kpi--accent"><p class="jcm-kpi__label">Em aberto</p><p class="jcm-kpi__val" id="cliKpiOpen">—</p></div>
          </div>
          <div class="jcm-seg" id="cliDetTabs">
            <button type="button" class="jcm-seg__btn is-active" data-cli-tab="resumo">Resumo</button>
            <button type="button" class="jcm-seg__btn" data-cli-tab="jobs">Jobs</button>
            <button type="button" class="jcm-seg__btn" data-cli-tab="extrato">Extrato</button>
          </div>
          <div id="cliDetResumo">
            <div class="jcm-card">
              <div class="jcm-dl" id="cliDetDl"></div>
            </div>
            <div class="jcm-notes" id="cliDetNotesWrap" hidden>
              <p class="jcm-notes__label">Notas internas</p>
              <p class="jcm-notes__body" id="cliDetNotes"></p>
            </div>
          </div>
          <div id="cliDetJobs" hidden></div>
          <div id="cliDetExtrato" hidden></div>
        </div>
      </div>

      <div class="jcm-foot" id="cliFoot">
        <a class="jcm-foot__btn jcm-foot__btn--ghost" id="cliFootExtrato" href="finance.html">Extrato</a>
        <a class="jcm-foot__btn jcm-foot__btn--primary" id="cliFootQuote" href="quote-builder.html">Nova quote</a>
      </div>
    </main>
  </div>

  <script src="crm-toast.js"></script>
  <script src="saas-branding.js"></script>
  <script src="om-device.js?v=20260925-device1"></script>
  <script src="crm-shared-nav.js?v=20260925-apptop1"></script>
  <script src="crm-shell.js?v=20260925-apptop1"></script>
  <script src="om-mobile-nav.js?v=20260925-apptop1"></script>
  <script src="customers-mobile.js?v=20260925-jcm1"></script>
</body>
</html>
