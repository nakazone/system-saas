<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#211d1a">
    <title>ObraMate - Forgot password</title>
    <link rel="icon" type="image/png" href="/assets/favicon-192.png?v=20260924-pwa" />
    <link rel="icon" href="/favicon.ico?v=20260924-pwa" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/favicon-180.png?v=20260924-pwa" />
    <link rel="stylesheet" href="styles.css?v=20261008-modulos1">
    <link rel="stylesheet" href="design-system.css?v=20261008-modulos1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth-pages.css?v=20261014-pw1">
    <link rel="stylesheet" href="/om-stable-viewport.css?v=20261007-stable1" id="om-stable-viewport-css" />
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <img src="/assets/obramate-logo.png" alt="ObraMate" class="logo-image">
                <h1>Forgot your password?</h1>
                <p>Enter your work e-mail and we’ll send a link to choose a new one.</p>
            </div>

            <form id="fpForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autofocus autocomplete="username">
                </div>
                <div id="fpError" class="error-message" role="alert" style="display:none"></div>
                <button type="submit" class="btn btn-primary btn-login-full" id="fpBtn" style="text-align:center">Send reset link</button>
            </form>

            <div id="fpDone" class="ap-done" role="status" hidden>
                <div class="ap-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg></div>
                <h2>Check your e-mail</h2>
                <p id="fpDoneText"></p>
                <p class="ap-muted">Didn’t get it? Check spam, or <a href="#" id="fpAgain">try again</a>.</p>
            </div>

            <div class="login-footer">
                <p class="login-alt"><a href="/login.html">← Back to sign in</a></p>
            </div>
        </div>
    </div>
    <script>
    (function () {
        var form = document.getElementById('fpForm');
        var err = document.getElementById('fpError');
        var btn = document.getElementById('fpBtn');
        var done = document.getElementById('fpDone');
        var input = document.getElementById('email');
        try { var q = new URLSearchParams(location.search).get('email'); if (q) input.value = q; } catch (e) {}
        function showErr(t) { err.textContent = t; err.style.display = 'block'; }
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            err.style.display = 'none';
            var email = input.value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('Enter a valid e-mail.'); input.focus(); return; }
            btn.disabled = true; btn.textContent = 'Sending…';
            try {
                var r = await fetch('/api/auth/forgot-password', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email }) });
                var j = await r.json().catch(function () { return {}; });
                if (!r.ok) { showErr(j.error || 'Something went wrong. Try again.'); return; }
                document.getElementById('fpDoneText').textContent = 'If ' + email + ' has an account, we sent a link to reset the password. It works for 1 hour.';
                form.hidden = true; done.hidden = false;
            } catch (e2) {
                showErr('Could not reach the server. Check your connection.');
            } finally {
                btn.disabled = false; btn.textContent = 'Send reset link';
            }
        });
        document.getElementById('fpAgain').addEventListener('click', function (e) { e.preventDefault(); done.hidden = true; form.hidden = false; input.focus(); });
    })();
    </script>
</body>
</html>
