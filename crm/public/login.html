<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#211d1a">
    <title>ObraMate - Login</title>
    <link rel="icon" type="image/png" href="/assets/favicon-192.png?v=20260924-pwa" />
    <link rel="icon" href="/favicon.ico?v=20260924-pwa" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/favicon-180.png?v=20260924-pwa" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="crm-toast.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      .workspace-picker { margin-top: 1rem; display: none; }
      .workspace-picker h2 { font-size: 1rem; margin: 0 0 0.75rem; }
      .workspace-option {
        display: block; width: 100%; text-align: left;
        margin: 0.4rem 0; padding: 0.75rem 1rem;
        border: 1px solid var(--border-color, #ddd); border-radius: 8px;
        background: #fff; cursor: pointer; font: inherit;
      }
      .workspace-option:hover { border-color: var(--primary-color, #211d1a); }
      .workspace-option strong { display: block; }
      .workspace-option span { font-size: 0.85rem; opacity: 0.7; }
      .login-alt { margin-top: 1rem; font-size: 0.875rem; text-align: center; }
      .login-alt a { color: inherit; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <img src="/assets/obramate-logo.png"
                     alt="ObraMate"
                     class="logo-image"
                     onerror="handleLogoError(this)">
                <h1>ObraMate</h1>
                <p>Sign in with your work email</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn btn-primary btn-login-full" id="loginBtn" style="text-align: center;">
                    Login
                </button>
            </form>

            <div id="workspacePicker" class="workspace-picker" aria-live="polite">
                <h2>Choose your company</h2>
                <div id="workspaceList"></div>
            </div>

            <div class="login-footer">
                <p class="login-alt">New company? <a href="/signup">Start free trial</a></p>
            </div>
        </div>
    </div>

    <script src="crm-toast.js"></script>
    <script>
        function handleLogoError(img) {
            const alternatives = [
                '/assets/obramate-logo.png',
                '/assets/obramate-logo.png'
            ];
            let currentIndex = 0;
            const tryNext = () => {
                if (currentIndex < alternatives.length) {
                    img.src = alternatives[currentIndex];
                    currentIndex++;
                } else {
                    img.style.display = 'none';
                    const textLogo = document.createElement('div');
                    textLogo.className = 'text-logo-fallback';
                    textLogo.innerHTML = '<div style="font-size: 2rem; font-weight: 700; color: var(--primary-color); margin-bottom: 1rem;">ObraMate</div>';
                    img.parentNode.insertBefore(textLogo, img);
                }
            };
            img.onerror = tryNext;
            tryNext();
        }

        let pendingPassword = '';

        fetch('/api/auth/session', { credentials: 'include' })
            .then(async (r) => {
                const data = await r.json().catch(() => ({}));
                if (!r.ok) {
                    const el = document.getElementById('errorMessage');
                    if (el) {
                        el.textContent = data.message || 'Erro ao contactar o servidor.';
                        el.style.display = 'block';
                    }
                    return;
                }
                if (data.authenticated) {
                    var u = data.user || {};
                    if (u.must_change_password) {
                        window.location.href = '/change-password.html';
                        return;
                    }
                    var role = String(u.role || '').toLowerCase();
                    if (role === 'installer' || role === 'crew_lead') {
                        window.location.href = '/campo/hoje.html';
                        return;
                    }
                    window.location.href = '/dashboard.html';
                }
            })
            .catch(() => {});

        function showWorkspaces(workspaces) {
            const picker = document.getElementById('workspacePicker');
            const list = document.getElementById('workspaceList');
            const form = document.getElementById('loginForm');
            list.innerHTML = '';
            workspaces.forEach(function (ws) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'workspace-option';
                btn.innerHTML = '<strong></strong><span></span>';
                btn.querySelector('strong').textContent = ws.name || ws.slug;
                btn.querySelector('span').textContent = ws.slug;
                btn.addEventListener('click', function () {
                    performLogin(ws.id);
                });
                list.appendChild(btn);
            });
            form.style.display = 'none';
            picker.style.display = 'block';
        }

        async function performLogin(organizationId) {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value || pendingPassword;
            const errorDiv = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');

            if (!email || !password) {
                errorDiv.textContent = 'Please fill in all fields';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.textContent = 'Logging in...';
            }

            try {
                const body = { email, password };
                if (organizationId) body.organizationId = organizationId;

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (data.success) {
                    var u = data.user || {};
                    var role = String(u.role || '').toLowerCase();
                    var dest = u.must_change_password
                        ? '/change-password.html'
                        : (role === 'installer' || role === 'crew_lead')
                            ? '/campo/hoje.html'
                            : '/dashboard.html';
                    setTimeout(function () {
                        window.location.href = dest;
                    }, 100);
                    return;
                }

                if (data.error === 'multiple_workspaces' && Array.isArray(data.workspaces)) {
                    pendingPassword = password;
                    showWorkspaces(data.workspaces);
                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Login';
                    }
                    return;
                }

                errorDiv.textContent =
                    (data.error || 'Login failed') + (data.message ? ' — ' + data.message : '');
                errorDiv.style.display = 'block';
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.style.display = 'block';
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
                if (typeof window.crmNotify === 'function') {
                    window.crmNotify('Connection error. Please try again.', 'error');
                }
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            performLogin();
        });
    </script>
</body>
</html>
