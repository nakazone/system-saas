<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ee" />
  <title>Jobs | ObraMate</title>
  <link rel="icon" type="image/png" href="/assets/obramateLogoSmallTransp.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/obramateLogoSmallTransp.png" />
  <link rel="stylesheet" href="styles.css?v=20260923-chrome" />
  <link rel="stylesheet" href="design-system.css?v=20260923-chrome" />
  <link rel="stylesheet" href="mobile-design-system.css?v=20260923-chrome" />
  <link rel="stylesheet" href="crm-shared-nav.css?v=11" />
  <link rel="stylesheet" href="crm-toast.css" />
  <link rel="stylesheet" href="crm-shell.css?v=20260924-shell2" />
  <link rel="stylesheet" href="crm-pwa-install.css?v=20260924-shell2" />
  <link rel="stylesheet" href="crm-job-modal.css?v=20260924-delete" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .jobs-page { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .jobs-toolbar { display: flex; flex-wrap: wrap; gap: 0.65rem; align-items: end; margin-bottom: 1rem; }
    .jobs-toolbar label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.75rem; font-weight: 600; color: #6b645c; }
    .jobs-toolbar input, .jobs-toolbar select { min-height: 2.35rem; padding: 0.4rem 0.65rem; border: 1px solid #e2d9cc; border-radius: 8px; background: #fff; font: inherit; }
    .jobs-toolbar .grow { flex: 1; min-width: 160px; }
    .jobs-table-wrap { background: #fff; border: 1px solid #e2d9cc; border-radius: 12px; overflow: auto; }
    .jobs-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .jobs-table th, .jobs-table td { padding: 0.75rem 0.85rem; text-align: left; border-bottom: 1px solid #ebe4da; }
    .jobs-table th { background: #faf8f5; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: #8a8074; }
    .jobs-table tr { cursor: pointer; }
    .jobs-table tr:hover td { background: #faf8f5; }
    .job-status { display: inline-flex; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; text-transform: capitalize; background: #efe8dc; color: #211d1a; }
    .job-status.is-scheduled { background: #dbeafe; color: #1d4ed8; }
    .job-status.is-in_progress { background: #ffedd5; color: #c2410c; }
    .job-status.is-completed { background: #d1fae5; color: #065f46; }
    .job-status.is-canceled { background: #fee2e2; color: #991b1b; }
    .jobs-empty { padding: 2rem; text-align: center; color: #8a8074; }
  </style>
</head>
<body class="dashboard-app-body">
  <header class="mobile-app-header" id="mobileAppHeader">
    <button type="button" class="mobile-app-header__menu" id="mobileMenuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="dashboardSidebar">
      <span class="mobile-app-header__menu-icon" aria-hidden="true"></span>
    </button>
    <div class="mobile-app-header__brand">
      <img src="/assets/obramate-logo.png" alt="ObraMate" class="mobile-app-header__logo crm-system-logo" width="28" height="28" onerror="this.style.display='none'" />
      <h1 class="mobile-app-header__title">Jobs</h1>
    </div>
  </header>

  <div class="dashboard-container">
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <img src="/assets/obramate-logo.png" alt="Empresa" class="sidebar-brand-logo" width="220" height="44" onerror="this.style.display='none'" />
      </div>
      <nav class="sidebar-nav" aria-label="Principal">
        <div id="crmSharedNavRoot" data-layout="sidebar"></div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-bar">
          <div class="sidebar-user-bar__avatar" id="sidebarUserAvatar" aria-hidden="true">—</div>
          <div class="sidebar-user-bar__text">
            <span class="sidebar-user-bar__name" id="sidebarUserName">—</span>
            <span class="sidebar-user-bar__role" id="sidebarUserRole"></span>
          </div>
          <button type="button" id="logoutBtn" class="sidebar-logout-btn" title="Sair" aria-label="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <main class="dashboard-main">
      <div class="jobs-page">
        <div class="crm-page-header">
          <div>
            <h1>Jobs / Work Orders</h1>
            <p class="muted" style="margin:0.25rem 0 0;color:#6b645c;font-size:0.9rem;">Trabalhos de builders e contractors fora do fluxo de leads/quotes.</p>
          </div>
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
            <a class="btn btn-secondary" href="schedule.html">Abrir Schedule</a>
            <button type="button" class="btn btn-primary" id="btnNewJob" data-crm-permission="work_orders.manage">+ Novo job</button>
          </div>
        </div>

        <div class="jobs-toolbar">
          <label class="grow">Buscar
            <input type="search" id="filterQ" placeholder="Título, origem, endereço…" />
          </label>
          <label>Status
            <select id="filterStatus">
              <option value="">Todos</option>
              <option value="draft">Draft</option>
              <option value="scheduled">Scheduled</option>
              <option value="in_progress">In progress</option>
              <option value="completed">Completed</option>
              <option value="canceled">Canceled</option>
            </select>
          </label>
          <label>Origem
            <select id="filterSource">
              <option value="">Todas</option>
              <option value="builder">Builder</option>
              <option value="contractor">Contractor</option>
              <option value="internal">Internal</option>
              <option value="other">Other</option>
            </select>
          </label>
          <button type="button" class="btn btn-secondary" id="btnReload">Atualizar</button>
        </div>

        <div class="jobs-table-wrap">
          <table class="jobs-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Título</th>
                <th>Origem</th>
                <th>Status</th>
                <th>Quando</th>
                <th>Responsável</th>
              </tr>
            </thead>
            <tbody id="jobsTableBody">
              <tr><td colspan="6" class="jobs-empty">Carregando…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="crm-toast.js"></script>
  <script src="crm-i18n.js?v=20260923-i18n"></script>
  <script src="saas-branding.js"></script>
  <script src="crm-address-autocomplete.js?v=20260924-addr"></script>
  <script src="crm-shell.js?v=20260924-addr"></script>
  <script src="crm-shared-nav.js?v=20260924-shell2"></script>
  <script src="crm-job-modal.js?v=20260924-delete"></script>
  <script src="jobs.js?v=20260924-jobmodal"></script>
</body>
</html>
