<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FA" />
  <title>ObraCrew</title>
  <link rel="icon" type="image/png" href="/assets/favicon-192.png?v=20260924-pwa" />
  <link rel="apple-touch-icon" href="/assets/obracrew/apple-touch-icon.png?v=1" />
  <link rel="manifest" href="/obracrew.webmanifest?v=1" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" />
  <style>
    body { margin: 0; min-height: 100dvh; box-sizing: border-box; padding: 24px 24px calc(32px + env(safe-area-inset-bottom)); background: var(--om-bg, #F7F8FA); color: var(--om-ink, #221E1A); font-family: Geist, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; }
    h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
    p { margin: 0 0 16px; font-size: 16px; line-height: 1.45; color: var(--om-ink-3, #475467); }
    a, button { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; font: inherit; font-size: 16px; font-weight: 600; text-decoration: none; border: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; transition: transform 120ms var(--om-ease-out, ease-out); }
    a:active, button:active { transform: scale(0.97); }
    @media (prefers-reduced-motion: reduce) { a:active, button:active { transform: none; opacity: 0.85; } }
    /* white text needs the strong orange (AA 5.1:1); #E7792C gave 2.9:1 */
    a { background: var(--om-accent-strong, #B4561A); color: #fff; }
    button { background: transparent; color: var(--om-ink-3, #475467); font-weight: 500; }
  </style>
</head>
<body>
  <h1>O ObraCrew é para a equipe de campo</h1>
  <p>Seu cargo usa o ObraMate. Se você trabalha em campo, fale com o administrador da sua empresa.</p>
  <a href="/dashboard">Abrir o ObraMate</a>
  <button type="button" id="sair">Sair</button>
  <script>
    document.getElementById('sair').addEventListener('click', function () {
      fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
        .catch(function () {})
        .then(function () { location.href = '/login.html?app=obracrew'; });
    });
  </script>
</body>
</html>
