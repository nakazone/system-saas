<body class="cm-app cm-hoje">
  <main class="cm-page dy" id="dyRoot" aria-busy="true">
    <header class="dy-hd">
      <div class="dy-av" id="dyAv" aria-hidden="true">·</div>
      <div class="dy-hd__t">
        <h1 id="dyHello">Meu dia</h1>
        <p id="dyDate">&nbsp;</p>
      </div>
      <span class="dy-net" id="dyNet" hidden>Sem sinal</span>
    </header>

    <div id="dyReturned"></div>
    <section id="dyCard" class="dy-card dy-card--load" aria-live="polite">
      <div class="dy-skel"></div><div class="dy-skel dy-skel--s"></div>
    </section>
    <section id="dyJobs"></section>
    <section id="dyPay"></section>
  </main>

  <!-- Sheets -->
  <div class="dy-layer" id="dyLayer" role="dialog" aria-modal="true" aria-labelledby="dySheetTitle" hidden>
    <div class="dy-backdrop" id="dyBackdrop" data-om-backdrop></div>
    <div class="dy-sheet" id="dySheet" data-om-motion="sheet">
      <div class="dy-sheet__grab" aria-hidden="true"></div>
      <header class="dy-sheet__hd">
        <h2 id="dySheetTitle">—</h2>
        <button type="button" class="dy-x" data-act="close" aria-label="Fechar">×</button>
      </header>
      <div class="dy-sheet__body" id="dySheetBody"></div>
      <footer class="dy-sheet__ft" id="dySheetFt"></footer>
    </div>
  </div>
  <input type="file" id="dyCam" accept="image/*" capture="environment" hidden />
  <div class="dy-toast" id="dyToast" role="status" hidden></div>
