<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f1ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ObraMate Campo" />
  <title>Hoje | Campo</title>
  <link rel="icon" type="image/png" href="/assets/favicon-192.png?v=20260924-pwa" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png?v=20260924-pwa" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="campo.css?v=20260925-campo5" />
  <script src="/om-device.js?v=20260925-device1"></script>
</head>
<body class="cm-app cm-hoje">
  <p class="cm-preview-note">Campo · preview desktop (use o telemóvel ou DevTools)</p>
  <main class="cm-page" id="cmHojeRoot">
    <header class="cm-header">
      <div class="cm-avatar" id="cmAvatar">DS</div>
      <div class="cm-header__text">
        <h1 class="cm-header__greet" id="cmGreet">Bom dia, Diego</h1>
        <p class="cm-header__meta" id="cmMeta">Equipe A · Sexta, 25 set</p>
      </div>
      <div class="cm-online" aria-live="polite">
        <span class="cm-online__dot" aria-hidden="true"></span>
        Online
      </div>
    </header>

    <section class="cm-diaria" aria-label="Diária de hoje">
      <div class="cm-diaria__top">
        <span>Folha de hoje</span>
        <span id="cmDiariaPeriod">—</span>
      </div>
      <p class="cm-diaria__amount" id="cmDiariaAmount">$0.00</p>
      <p class="cm-diaria__status" id="cmDiariaStatus">Sem lançamento</p>

      <div class="cm-diaria__row">
        <div class="cm-diaria__chip" id="cmDiariaChip">
          <span class="cm-diaria__chip-label">Diária</span>
          <span class="cm-diaria__chip-val" id="cmDiariaChipVal">Pendente</span>
        </div>
        <div class="cm-diaria__chip">
          <span class="cm-diaria__chip-label">Horas extras</span>
          <span class="cm-diaria__chip-val" id="cmExtraVal">0 min</span>
        </div>
      </div>

      <button type="button" class="cm-btn cm-btn--accent cm-btn--full" id="cmAddDiariaBtn">
        Adicionar diária inteira
      </button>

      <div class="cm-extra" aria-label="Horas extras">
        <p class="cm-extra__label">Extras · passos de 30 min</p>
        <div class="cm-extra__controls">
          <button type="button" class="cm-extra__btn" id="cmExtraMinus" aria-label="Remover 30 minutos">−30</button>
          <span class="cm-extra__mid" id="cmExtraMid">0 min</span>
          <button type="button" class="cm-extra__btn cm-extra__btn--plus" id="cmExtraPlus" aria-label="Adicionar 30 minutos">+30</button>
        </div>
      </div>
      <p class="cm-diaria__hint" id="cmDiariaHint" hidden></p>
    </section>

    <section class="cm-pay" aria-label="Próximos pagamentos">
      <div class="cm-pay__head">
        <h2 class="cm-pay__title">Próximos pagamentos</h2>
      </div>
      <div id="cmPayList" class="cm-pay__list"></div>
    </section>

    <section class="cm-here" id="cmHereCard" aria-label="Obra atual">
      <div class="cm-here__top">
        <p class="cm-here__label">Próxima obra</p>
        <p class="cm-here__time" id="cmHereTime">—</p>
      </div>
      <h2 class="cm-here__title" id="cmHereTitle">—</h2>
      <p class="cm-here__client" id="cmHereClient">—</p>
      <p class="cm-here__addr" id="cmHereAddr">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-4.5 7-11a7 7 0 10-14 0c0 6.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="cmHereAddrText">—</span>
      </p>
      <div class="cm-here__actions">
        <a class="cm-btn cm-btn--icon" id="cmNavBtn" href="#" target="_blank" rel="noopener" aria-label="Navegar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8z"/></svg>
        </a>
        <a class="cm-btn cm-btn--dark" id="cmOpenTicket" href="ticket.html">Abrir ticket</a>
      </div>
    </section>

    <div class="cm-section-head">
      <h2 class="cm-section-title">Hoje</h2>
      <a class="cm-link" href="agenda.html">Ver semana</a>
    </div>
    <div class="cm-list" id="cmDayList"></div>
  </main>

  <script src="campo-data.js?v=20260925-campo5"></script>
  <script src="campo-gate.js?v=20260925-campo5"></script>
  <script src="campo-nav.js?v=20260925-campo5"></script>
  <script src="hoje.js?v=20260925-campo5"></script>
</body>
</html>
