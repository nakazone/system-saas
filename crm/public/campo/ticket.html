<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f1ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Ticket | Campo</title>
  <link rel="icon" type="image/png" href="/assets/favicon-192.png?v=20260924-pwa" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="campo.css?v=20261006-deliv4" />
  <script src="/om-device.js?v=20261001-tablet2"></script>
</head>
<body class="cm-app cm-ticket">
  <main class="cm-page cm-page--ticket" id="cmTicketRoot">
    <header class="cm-ticket-top">
      <button type="button" class="cm-icon-btn" id="cmTicketBack" aria-label="Voltar">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="cm-ticket-top__title" id="cmTicketTitle">Ticket</h1>
      <button type="button" class="cm-problem-btn" id="cmProblemBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg>
        Problema
      </button>
    </header>

    <section class="cm-ticket-hero" id="cmTicketHero">
      <div class="cm-ticket-hero__top">
        <p class="cm-ticket-hero__when" id="cmTicketWhen">—</p>
        <span class="cm-badge cm-badge--hero" id="cmTicketBadge">—</span>
      </div>
      <h2 class="cm-ticket-hero__title" id="cmTicketJob">—</h2>
      <p class="cm-ticket-hero__sub" id="cmTicketSub">—</p>
      <a class="cm-ticket-nav" id="cmTicketNav" href="#" target="_blank" rel="noopener">
        <span class="cm-ticket-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8z"/></svg>
        </span>
        <span>
          <strong id="cmTicketAddr">—</strong>
          <small>Toque para navegar</small>
        </span>
      </a>
      <div class="cm-stepper" id="cmStepper" aria-label="Status da visita"></div>
    </section>

    <div class="cm-ticket-tabs" role="tablist">
      <button type="button" class="cm-ticket-tabs__btn is-active" data-tab="details" role="tab" aria-selected="true">Detalhes</button>
      <button type="button" class="cm-ticket-tabs__btn" data-tab="checklist" role="tab" aria-selected="false" id="cmTabChecklist">Checklist</button>
      <button type="button" class="cm-ticket-tabs__btn" data-tab="photos" role="tab" aria-selected="false" id="cmTabPhotos">Fotos</button>
    </div>

    <div class="cm-ticket-panel" id="cmPanelDetails" data-panel="details">
      <div class="cm-attention" id="cmAttention" hidden>
        <div class="cm-attention__icon" aria-hidden="true">!</div>
        <div>
          <p class="cm-attention__label">Atenção</p>
          <p class="cm-attention__text" id="cmAttentionText"></p>
        </div>
      </div>
      <section class="cm-scope" id="cmScope">
        <div class="cm-scope__head">
          <h3>Escopo</h3>
          <span id="cmScopeTotal">—</span>
        </div>
        <div id="cmScopeList"></div>
      </section>
      <p class="cm-subtitle" id="cmNotes" hidden></p>
    </div>

    <div class="cm-ticket-panel" id="cmPanelChecklist" data-panel="checklist" hidden>
      <div class="cm-check-head">
        <h3>Checklist da fase</h3>
        <span id="cmCheckCount">0 de 0</span>
      </div>
      <div class="cm-check-bar"><span id="cmCheckBarFill"></span></div>
      <div class="cm-check-actions">
        <button type="button" class="cm-btn cm-btn--dark cm-btn--sm" id="cmCheckTemplateBtn" style="width:auto">Template</button>
        <button type="button" class="cm-btn cm-btn--dark cm-btn--sm" id="cmCheckVoiceBtn" style="width:auto">Falar itens</button>
        <button type="button" class="cm-btn cm-btn--dark cm-btn--sm" id="cmCheckRecapBtn" style="width:auto">Recap</button>
      </div>
      <p class="cm-check-recap" id="cmCheckRecap" hidden></p>
      <div id="cmCheckList"></div>
    </div>

    <div class="cm-ticket-panel" id="cmPanelPhotos" data-panel="photos" hidden>
      <div class="cm-photos-head">
        <h3>Fotos da obra</h3>
        <label class="cm-btn cm-btn--dark cm-btn--sm" style="width:auto;min-height:40px;padding:0.45rem 0.9rem">
          Capturar
          <input type="file" id="cmPhotoInput" accept="image/*" capture="environment" hidden />
        </label>
      </div>
      <p class="cm-photos-pending" id="cmPhotosPending" hidden></p>
      <div class="cm-photo-stage cm-chip-row" role="group" aria-label="Etapa da foto">
        <button type="button" class="cm-chip is-selected" data-photo-stage="">Geral</button>
        <button type="button" class="cm-chip" data-photo-stage="before">Antes</button>
        <button type="button" class="cm-chip" data-photo-stage="during">Durante</button>
        <button type="button" class="cm-chip" data-photo-stage="after">Depois</button>
      </div>
      <label class="cm-photo-caption-label" for="cmPhotoCaption">Legenda (opcional)</label>
      <input type="text" id="cmPhotoCaption" class="cm-input" maxlength="500" placeholder="Ex.: piso instalado, parede oeste" autocomplete="off" />
      <label class="cm-photo-public">
        <input type="checkbox" id="cmPhotoPublic" />
        Incluir no link público do job
      </label>
      <div class="cm-photos-actions">
        <button type="button" class="cm-btn cm-btn--dark cm-btn--sm" id="cmPhotoReportBtn" style="width:auto">
          Gerar relatório
        </button>
        <button type="button" class="cm-btn cm-btn--dark cm-btn--sm" id="cmInspectBtn" style="width:auto">
          Vistoria falada
        </button>
        <button type="button" class="cm-btn cm-btn--dark cm-btn--sm" id="cmMeasureBtn" style="width:auto">
          Medir
        </button>
      </div>
      <p class="cm-photos-pending" id="cmInspectStatus" hidden></p>
      <div class="cm-report-card" id="cmReportCard" hidden>
        <h4 id="cmReportTitle">Relatório</h4>
        <p id="cmReportSummary"></p>
      </div>
      <div class="cm-photos-grid" id="cmPhotosGrid"></div>
    </div>

    <div class="cm-ticket-cta" id="cmTicketCtaWrap">
      <button type="button" class="cm-btn cm-btn--accent" id="cmTicketCta">Estou a caminho</button>
    </div>
  </main>

  <button type="button" class="cm-sheet-backdrop" id="cmProblemBackdrop" hidden aria-label="Fechar"></button>
  <div class="cm-sheet" id="cmProblemSheet" role="dialog" aria-modal="true" hidden>
    <div class="cm-sheet__grab" aria-hidden="true"></div>
    <div class="cm-sheet__head">
      <div>
        <h2 class="cm-sheet__title">Reportar problema</h2>
        <p class="cm-sheet__sub">O escritório recebe este aviso</p>
      </div>
      <button type="button" class="cm-sheet__close" id="cmProblemClose" aria-label="Fechar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <label class="cm-field">
      <span>Descrição</span>
      <textarea id="cmProblemNote" rows="4" placeholder="Ex.: cliente não está em casa, material incompleto…"></textarea>
    </label>
    <button type="button" class="cm-btn cm-btn--accent" id="cmProblemSubmit" style="margin-top:0.85rem">Enviar</button>
  </div>

  <button type="button" class="cm-sheet-backdrop" id="cmAnnotBackdrop" hidden aria-label="Fechar"></button>
  <div class="cm-sheet cm-sheet--tall" id="cmAnnotSheet" role="dialog" aria-modal="true" hidden>
    <div class="cm-sheet__grab" aria-hidden="true"></div>
    <div class="cm-sheet__head">
      <div>
        <h2 class="cm-sheet__title">Anotar foto</h2>
        <p class="cm-sheet__sub">Seta, círculo, texto ou desenho — não altera o original</p>
      </div>
      <button type="button" class="cm-sheet__close" id="cmAnnotClose" aria-label="Fechar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="cm-annot-tools" role="toolbar">
      <button type="button" class="cm-chip is-selected" data-annot-tool="freehand">Desenho</button>
      <button type="button" class="cm-chip" data-annot-tool="arrow">Seta</button>
      <button type="button" class="cm-chip" data-annot-tool="circle">Círculo</button>
      <button type="button" class="cm-chip" data-annot-tool="text">Texto</button>
      <button type="button" class="cm-chip" id="cmAnnotUndo">Desfazer</button>
    </div>
    <div class="cm-annot-stage">
      <img id="cmAnnotImg" alt="" />
      <canvas id="cmAnnotCanvas"></canvas>
    </div>
    <button type="button" class="cm-btn cm-btn--accent" id="cmAnnotSave" style="margin-top:0.85rem">Guardar anotações</button>
  </div>

  <div class="cm-lightbox" id="cmLightbox" role="dialog" aria-modal="true" aria-label="Foto da obra" hidden>
    <div class="cm-lightbox__top">
      <p class="cm-lightbox__count" id="cmLightboxCount"></p>
      <button type="button" class="cm-lightbox__close" id="cmLightboxClose" aria-label="Fechar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="cm-lightbox__stage">
      <button type="button" class="cm-lightbox__nav cm-lightbox__nav--prev" id="cmLightboxPrev" aria-label="Foto anterior">‹</button>
      <img class="cm-lightbox__img" id="cmLightboxImg" alt="" />
      <button type="button" class="cm-lightbox__nav cm-lightbox__nav--next" id="cmLightboxNext" aria-label="Próxima foto">›</button>
    </div>
    <p class="cm-lightbox__cap" id="cmLightboxCap"></p>
    <div class="cm-lightbox__actions" id="cmLightboxActions" hidden>
      <button type="button" class="cm-chip" data-lb-action="anotar">Anotar</button>
      <button type="button" class="cm-chip" data-lb-action="legenda">Legenda</button>
      <button type="button" class="cm-chip" data-lb-action="voz">Voz</button>
      <button type="button" class="cm-chip" data-lb-action="ocr">OCR</button>
      <button type="button" class="cm-chip" data-lb-action="publico">Público</button>
      <button type="button" class="cm-chip" data-lb-action="privado">Privado</button>
      <button type="button" class="cm-chip cm-chip--danger" data-lb-action="apagar">Apagar</button>
    </div>
  </div>

  <script src="campo-nav.js?v=20260929-obranames1"></script>
  <script src="campo-media-queue.js?v=20260928-media1"></script>
  <script src="ticket.js?v=20261006-deliv1"></script>
</body>
</html>
