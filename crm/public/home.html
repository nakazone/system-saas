<body class="dashboard-app-body om-app sidebar-collapsed home-app">
  <script>
    (function () {
      try {
        if (localStorage.getItem("crm_sidebar_collapsed") === "0") {
          document.body.classList.remove("sidebar-collapsed");

      } catch (e) {}

  <header class="mobile-app-header" id="mobileAppHeader">

    </div>
  </header>

        <header class="home-top">

              class="home-brand-logo"
              src="/assets/favicon-192.png?v=20260924-pwa"

          <a class="home-action" href="quote-builder.html">

            </span>

          <a class="home-action" href="invoices.html">

            </span>
