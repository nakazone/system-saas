<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ee" />
  <title>Schedule | ObraMate</title>
  <link rel="icon" type="image/png" href="/assets/obramate-logo.png" />
  <link rel="stylesheet" href="styles.css?v=20260923-chrome" />
  <link rel="stylesheet" href="design-system.css?v=20260923-chrome" />
  <link rel="stylesheet" href="mobile-design-system.css?v=20260923-chrome" />
  <link rel="stylesheet" href="crm-shared-nav.css?v=11" />
  <link rel="stylesheet" href="crm-toast.css" />
  <link rel="stylesheet" href="crm-shell.css?v=20260923-chrome" />
  <link rel="stylesheet" href="schedule.css?v=20260923-schedule" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="dashboard-app-body">
  <header class="mobile-app-header" id="mobileAppHeader">
    <button type="button" class="mobile-app-header__menu" id="mobileMenuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="dashboardSidebar">
      <span class="mobile-app-header__menu-icon" aria-hidden="true"></span>
    </button>
    <div class="mobile-app-header__brand">
      <img src="/assets/obramate-logo.png" alt="ObraMate" class="mobile-app-header__logo crm-system-logo" width="28" height="28" onerror="this.style.display='none'" />
      <h1 class="mobile-app-header__title">Schedule</h1>
    </div>
  </header>

  <div class="dashboard-container">
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <img src="/assets/obramate-logo.png" alt="Empresa" class="sidebar-brand-logo" width="220" height="44" onerror="this.style.display='none'" />
      </div>
      <nav class="sidebar-nav" aria-label="Principal">
        <div id="crmSharedNavRoot" data-layout="sidebar"></div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-bar">
          <div class="sidebar-user-bar__avatar" id="sidebarUserAvatar" aria-hidden="true">—</div>
          <div class="sidebar-user-bar__text">
            <span class="sidebar-user-bar__name" id="sidebarUserName">—</span>
            <span class="sidebar-user-bar__role" id="sidebarUserRole"></span>
          </div>
          <button type="button" id="logoutBtn" class="sidebar-logout-btn" title="Sair" aria-label="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <main class="dashboard-main">
      <div class="sched-page">
        <div class="crm-page-header">
          <div>
            <h1>Schedule</h1>
            <p class="sched-lead">Jobs e meetings no mesmo calendário.</p>
          </div>
          <div class="sched-actions">
            <a class="btn btn-secondary" href="jobs.html">Jobs</a>
            <button type="button" class="btn btn-secondary" id="btnNewMeeting" data-crm-permission="schedule.manage">+ Meeting</button>
            <a class="btn btn-primary" href="jobs.html" data-crm-permission="work_orders.manage">+ Job</a>
          </div>
        </div>

        <div class="sched-toolbar">
          <div class="sched-nav">
            <button type="button" class="btn btn-secondary btn-sm" id="btnPrev">‹</button>
            <button type="button" class="btn btn-secondary btn-sm" id="btnToday">Hoje</button>
            <button type="button" class="btn btn-secondary btn-sm" id="btnNext">›</button>
            <h2 id="schedRangeLabel">—</h2>
          </div>
          <div class="sched-view-toggle" role="group" aria-label="Vista">
            <button type="button" class="sched-view-btn is-active" data-view="month">Mês</button>
            <button type="button" class="sched-view-btn" data-view="week">Semana</button>
          </div>
          <div class="sched-legend">
            <span><i class="sched-dot sched-dot--job"></i> Job</span>
            <span><i class="sched-dot sched-dot--meeting"></i> Meeting</span>
          </div>
        </div>

        <div id="schedCalendar" class="sched-calendar" aria-live="polite"></div>
      </div>
    </main>
  </div>

  <div class="sched-modal-backdrop" id="eventBackdrop"></div>
  <div class="sched-modal" id="eventModal" role="dialog" aria-modal="true">
    <h2 id="eventModalTitle">Evento</h2>
    <div id="eventModalBody" class="sched-event-body"></div>
    <div class="sched-modal-actions">
      <button type="button" class="btn btn-secondary" id="btnCloseEvent">Fechar</button>
      <a class="btn btn-primary" id="btnOpenJob" hidden href="jobs.html">Abrir job</a>
    </div>
  </div>

  <div class="sched-modal-backdrop" id="meetingBackdrop"></div>
  <div class="sched-modal" id="meetingModal" role="dialog" aria-modal="true">
    <h2>Novo meeting</h2>
    <form id="meetingForm" class="sched-form">
      <label>Título *
        <input type="text" id="mtgTitle" required maxlength="200" />
      </label>
      <div class="sched-form-row">
        <label>Início *
          <input type="datetime-local" id="mtgStart" required />
        </label>
        <label>Fim *
          <input type="datetime-local" id="mtgEnd" required />
        </label>
      </div>
      <label>Local
        <input type="text" id="mtgLocation" maxlength="500" />
      </label>
      <label>Responsável
        <select id="mtgAssignee"><option value="">—</option></select>
      </label>
      <label>Notas
        <textarea id="mtgNotes" rows="3" maxlength="8000"></textarea>
      </label>
      <div class="sched-modal-actions">
        <button type="button" class="btn btn-secondary" id="btnCancelMeeting">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>

  <script src="crm-toast.js"></script>
  <script src="crm-i18n.js?v=20260923-i18n"></script>
  <script src="saas-branding.js"></script>
  <script src="crm-shared-nav.js?v=20260923-jobs"></script>
  <script src="crm-shell.js?v=20260923-chrome"></script>
  <script src="schedule.js?v=20260923-schedule"></script>
</body>
</html>
