<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ee" />
  <title>Schedule | ObraMate</title>
  <link rel="icon" type="image/png" href="/assets/obramateLogoSmallTransp.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/obramateLogoSmallTransp.png" />
  <link rel="stylesheet" href="styles.css?v=20260924-gcal" />
  <link rel="stylesheet" href="design-system.css?v=20260924-gcal" />
  <link rel="stylesheet" href="mobile-design-system.css?v=20260924-gcal" />
  <link rel="stylesheet" href="crm-shared-nav.css?v=11" />
  <link rel="stylesheet" href="crm-toast.css" />
  <link rel="stylesheet" href="crm-shell.css?v=20260924-shell2" />
  <link rel="stylesheet" href="crm-pwa-install.css?v=20260924-shell2" />
  <link rel="stylesheet" href="crm-job-modal.css?v=20260924-delete" />
  <link rel="stylesheet" href="schedule.css?v=20260924-maps3" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="dashboard-app-body sched-body">
  <header class="mobile-app-header" id="mobileAppHeader">
    <button type="button" class="mobile-app-header__menu" id="mobileMenuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="dashboardSidebar">
      <span class="mobile-app-header__menu-icon" aria-hidden="true"></span>
    </button>
    <div class="mobile-app-header__brand">
      <img src="/assets/obramate-logo.png" alt="ObraMate" class="mobile-app-header__logo crm-system-logo" width="28" height="28" onerror="this.style.display='none'" />
      <h1 class="mobile-app-header__title">Schedule</h1>
    </div>
    <button type="button" class="sched-mobile-filters-btn" id="btnToggleCalSidebar" aria-label="Filtros">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    </button>
  </header>

  <div class="dashboard-container">
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <img src="/assets/obramate-logo.png" alt="Empresa" class="sidebar-brand-logo" width="220" height="44" onerror="this.style.display='none'" />
      </div>
      <nav class="sidebar-nav" aria-label="Principal">
        <div id="crmSharedNavRoot" data-layout="sidebar"></div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-bar">
          <div class="sidebar-user-bar__avatar" id="sidebarUserAvatar" aria-hidden="true">—</div>
          <div class="sidebar-user-bar__text">
            <span class="sidebar-user-bar__name" id="sidebarUserName">—</span>
            <span class="sidebar-user-bar__role" id="sidebarUserRole"></span>
          </div>
          <button type="button" id="logoutBtn" class="sidebar-logout-btn" title="Sair" aria-label="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <main class="dashboard-main sched-main">
      <!-- Google Calendar–style top chrome -->
      <header class="gcal-topbar">
        <div class="gcal-topbar__left">
          <button type="button" class="gcal-create" id="btnCreate" data-crm-permission="schedule.manage" aria-haspopup="menu" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            Criar
          </button>
          <div class="gcal-create-menu" id="createMenu" hidden role="menu">
            <button type="button" role="menuitem" id="menuNewMeeting" data-crm-permission="schedule.manage">Meeting</button>
            <button type="button" role="menuitem" id="menuNewJob" data-crm-permission="work_orders.manage">Job</button>
          </div>
          <button type="button" class="gcal-today" id="btnToday">Hoje</button>
          <div class="gcal-nav-arrows">
            <button type="button" class="gcal-icon-btn" id="btnPrev" aria-label="Anterior">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button type="button" class="gcal-icon-btn" id="btnNext" aria-label="Seguinte">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
          <h1 class="gcal-range" id="schedRangeLabel">—</h1>
        </div>
        <div class="gcal-topbar__right">
          <label class="gcal-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="filterQ" placeholder="Pesquisar jobs e meetings" autocomplete="off" />
          </label>
          <div class="gcal-view-toggle" role="group" aria-label="Vista">
            <button type="button" class="gcal-view-btn" data-view="day">Dia</button>
            <button type="button" class="gcal-view-btn is-active" data-view="week">Semana</button>
            <button type="button" class="gcal-view-btn" data-view="month">Mês</button>
            <button type="button" class="gcal-view-btn" data-view="agenda">Agenda</button>
          </div>
          <button type="button" class="gcal-map-btn" id="btnOpenMap" title="Mapa e distâncias entre eventos">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6l7-3 8 3 7-3v15l-7 3-8-3-7 3V6z"/><path d="M8 3v15"/><path d="M16 6v15"/></svg>
            Mapa
          </button>
          <a class="gcal-link-jobs" href="jobs.html">Jobs</a>
        </div>
      </header>

      <div class="gcal-layout">
        <!-- Left rail: mini month + business calendars/filters -->
        <aside class="gcal-rail" id="gcalRail">
          <div class="gcal-mini" id="miniMonth" aria-label="Mini calendário"></div>

          <div class="gcal-cal-section">
            <p class="gcal-cal-section__title">Calendários</p>
            <label class="gcal-check">
              <input type="checkbox" id="filterJobs" checked />
              <span class="gcal-swatch gcal-swatch--job"></span>
              Jobs
            </label>
            <label class="gcal-check">
              <input type="checkbox" id="filterMeetings" checked />
              <span class="gcal-swatch gcal-swatch--meeting"></span>
              Meetings
            </label>
          </div>

          <div class="gcal-cal-section">
            <p class="gcal-cal-section__title">Filtros do negócio</p>
            <label class="gcal-field">Responsável
              <select id="filterAssignee"><option value="">Todos</option></select>
            </label>
            <label class="gcal-field">Origem
              <select id="filterSource">
                <option value="">Todas</option>
                <option value="builder">Builder</option>
                <option value="contractor">Contractor</option>
                <option value="internal">Internal</option>
                <option value="other">Other</option>
              </select>
            </label>
            <label class="gcal-field">Status do job
              <select id="filterStatus">
                <option value="">Todos</option>
                <option value="draft">Draft</option>
                <option value="scheduled">Scheduled</option>
                <option value="in_progress">In progress</option>
                <option value="completed">Completed</option>
              </select>
            </label>
            <label class="gcal-check gcal-check--solo">
              <input type="checkbox" id="filterMine" />
              Só os meus
            </label>
          </div>
        </aside>
        <div class="gcal-rail-backdrop" id="gcalRailBackdrop" hidden></div>

        <section class="gcal-board" aria-live="polite">
          <div id="schedCalendar" class="gcal-board__inner"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Event popover -->
  <div class="gcal-popover-backdrop" id="eventBackdrop" hidden></div>
  <div class="gcal-popover" id="eventModal" role="dialog" aria-modal="true" hidden>
    <button type="button" class="gcal-popover__close" id="btnCloseEvent" aria-label="Fechar">×</button>
    <div class="gcal-popover__accent" id="eventAccent"></div>
    <h2 id="eventModalTitle">Evento</h2>
    <div id="eventModalBody" class="gcal-popover__body"></div>
    <div class="gcal-popover__actions">
      <a class="btn btn-secondary btn-sm" id="btnOpenJob" href="jobs.html" hidden>Abrir job</a>
      <button type="button" class="btn btn-primary btn-sm" id="btnEditEvent" hidden>Editar</button>
      <button type="button" class="btn btn-danger btn-sm" id="btnDeleteEvent" hidden>Excluir</button>
      <button type="button" class="btn btn-secondary btn-sm" id="btnCloseEvent2">Fechar</button>
    </div>
  </div>

  <!-- Meeting create / edit -->
  <div class="sched-modal-backdrop" id="meetingBackdrop"></div>
  <div class="sched-modal" id="meetingModal" role="dialog" aria-modal="true">
    <h2 id="meetingModalTitle">Novo meeting</h2>
    <form id="meetingForm" class="sched-form">
      <label>Título *
        <input type="text" id="mtgTitle" required maxlength="200" />
      </label>
      <div class="sched-form-row">
        <label>Início *
          <input type="datetime-local" id="mtgStart" required />
        </label>
        <label>Fim *
          <input type="datetime-local" id="mtgEnd" required />
        </label>
      </div>
      <label>Local
        <input type="text" id="mtgLocation" maxlength="500" placeholder="Digite a morada (Google Maps)..." autocomplete="street-address" data-crm-address-autocomplete="1" />
      </label>
      <label>Responsável
        <select id="mtgAssignee"><option value="">—</option></select>
      </label>
      <label>Notas
        <textarea id="mtgNotes" rows="3" maxlength="8000"></textarea>
      </label>
      <div class="sched-modal-actions">
        <button type="button" class="btn btn-danger" id="btnDeleteMeeting" hidden>Excluir</button>
        <button type="button" class="btn btn-secondary" id="btnCancelMeeting">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>

  <!-- Quick create chooser when clicking empty slot -->
  <div class="gcal-slot-menu" id="slotMenu" hidden role="menu">
    <button type="button" role="menuitem" id="slotNewMeeting">+ Meeting neste horário</button>
    <button type="button" role="menuitem" id="slotNewJob">+ Job neste horário</button>
  </div>

  <!-- Schedule map / distances -->
  <div class="sched-map-backdrop" id="mapBackdrop" hidden></div>
  <div class="sched-map-panel" id="mapPanel" role="dialog" aria-modal="true" aria-labelledby="mapPanelTitle" hidden>
    <header class="sched-map-panel__head">
      <div>
        <h2 id="mapPanelTitle">Mapa dos eventos</h2>
        <p class="sched-map-panel__sub" id="mapPanelSub">Distâncias entre locais na agenda atual</p>
      </div>
      <button type="button" class="gcal-icon-btn" id="btnCloseMap" aria-label="Fechar mapa">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="sched-map-panel__body">
      <aside class="sched-map-list" id="mapList"></aside>
      <div class="sched-map-canvas-wrap">
        <div id="schedMapCanvas" class="sched-map-canvas" aria-label="Mapa"></div>
        <p class="sched-map-hint" id="mapHint">Eventos com endereço aparecem no mapa. Selecione dois na lista para medir a distância.</p>
      </div>
    </div>
  </div>

  <script src="crm-toast.js"></script>
  <script src="crm-i18n.js?v=20260923-i18n"></script>
  <script src="saas-branding.js"></script>
  <script src="crm-address-autocomplete.js?v=20260924-maps3"></script>
  <script src="crm-shell.js?v=20260924-maps3"></script>
  <script src="crm-shared-nav.js?v=20260924-jobber"></script>
  <script src="crm-job-modal.js?v=20260924-jobber"></script>
  <script src="schedule.js?v=20260924-maps3"></script>
</body>
</html>
