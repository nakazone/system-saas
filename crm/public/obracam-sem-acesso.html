<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>ObraCam</title>
  <link rel="icon" type="image/png" href="/assets/favicon-192.png?v=20260924-pwa" />
  <link rel="apple-touch-icon" href="/assets/obracam/apple-touch-icon.png?v=1" />
  <link rel="manifest" href="/obracam.webmanifest?v=1" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" />
  <style>
    /* this page is sent as is (no server injection), so the ObraMate tokens come with their values as fallbacks */
    body { margin: 0; min-height: 100dvh; box-sizing: border-box; padding: 24px 24px calc(32px + env(safe-area-inset-bottom)); background: var(--om-card, #fff); color: var(--om-ink, #221E1A); font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; }
    h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
    p { margin: 0 0 16px; font-size: 16px; line-height: 1.45; color: var(--om-ink-3, #475467); }
    a, button { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; font: inherit; font-size: 16px; font-weight: 600; text-decoration: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: transform 120ms cubic-bezier(.23, 1, .32, 1); }
    a:active, button:active { transform: scale(.97); }
    @media (prefers-reduced-motion: reduce) { a:active, button:active { transform: none; } }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--om-accent-strong, #B4561A); outline-offset: 2px; }
    a { background: var(--om-accent-strong, #B4561A); color: #fff; }
    button { background: transparent; color: var(--om-ink-3, #475467); font-weight: 500; }
  </style>
</head>
<body>
  <h1>O ObraCam é para administradores, gerentes e escritório</h1>
  <p>Seu cargo continua vendo as fotos no ObraMate. Se precisar deste app, fale com o administrador da sua empresa.</p>
  <a href="/dashboard">Abrir o ObraMate</a>
  <button type="button" id="sair">Sair</button>
  <script>
    document.getElementById('sair').addEventListener('click', function () {
      fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
        .catch(function () {})
        .then(function () { location.href = '/login.html?app=obracam'; });
    });
  </script>
</body>
</html>
