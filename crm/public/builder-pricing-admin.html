<body class="dashboard-app-body om-app sidebar-collapsed bp-page-body tv-body">
  <script>
    (function () {
      try {
        if (localStorage.getItem("crm_sidebar_collapsed") === "0") {
          document.body.classList.remove("sidebar-collapsed");
        }
      } catch (e) {}
    })();

        </button>
      </div>
      <nav class="sidebar-nav" aria-label="Principal">

      </nav>
      <div class="sidebar-footer">

    <main class="dashboard-main">
      <div class="tv" id="tv">

            <div class="tv-list__top">
              <div class="tv-title"><h1>Tabela de Valor</h1><button type="button" class="tv-btn tv-btn--pri tv-btn--sm" id="tvNewBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Novo</span></button></div>
              <p class="tv-sub" id="tvSub">Preços por tipo de cliente</p>
