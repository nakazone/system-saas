<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ee" />
  <title>Faturas | ObraMate</title>
  <style id="om-chrome-critical">html{--plab-rail:72px;--crm-sidebar-expanded-width:232px}body.om-app.dashboard-app-body{--crm-topbar-height:56px;--crm-sidebar-width:var(--crm-sidebar-expanded-width,232px)}body.om-app.dashboard-app-body.sidebar-collapsed{--crm-sidebar-width:72px}@media (min-width:1025px){body.om-app .dashboard-container{display:block!important;margin-left:var(--crm-sidebar-width,72px)!important;margin-top:var(--crm-topbar-height)!important;width:auto}body.om-app #dashboardSidebar,body.om-app .dashboard-sidebar{position:fixed!important;inset:0 auto 0 0!important;top:0!important;left:0!important;width:var(--crm-sidebar-width,72px)!important;min-width:var(--crm-sidebar-width,72px)!important;max-width:var(--crm-sidebar-width,72px)!important;height:100vh!important;margin:0!important;transform:none!important;transition:none!important;z-index:40}body.om-app.sidebar-collapsed #dashboardSidebar,body.om-app.sidebar-collapsed .dashboard-sidebar{overflow:visible!important}body.om-app .dashboard-main{margin-left:0!important;margin-top:var(--crm-topbar-height)!important;display:flex!important;flex-direction:column!important;transition:none!important;padding-bottom:6.5rem!important}body.om-app .dashboard-sidebar,body.om-app .dashboard-container{transition:none!important}body.om-app.sidebar-collapsed .nav-item__label,body.om-app.sidebar-collapsed .sidebar-user-bar__text{display:none!important}body.om-app.sidebar-collapsed .sidebar-nav-group-label{visibility:hidden!important}}/*maismob2*/@media (max-width:1024px){body.om-app.dashboard-app-body,body.om-app{--crm-sidebar-width:0px!important}body.om-app .dashboard-container{display:block!important;margin:0!important;width:100%!important;max-width:100%!important}body.om-app .dashboard-main,body.om-app.dashboard-app-body .dashboard-main,body.om-app.sidebar-collapsed .dashboard-main{margin:0!important;margin-left:0!important;margin-top:0!important;width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important}body.om-app #dashboardSidebar,body.om-app .dashboard-sidebar{position:fixed!important;left:0!important;top:0!important;height:100vh!important;height:100dvh!important;width:min(288px,92vw)!important;min-width:0!important;max-width:min(288px,92vw)!important;transform:translate3d(-105%,0,0)!important;z-index:1100!important;margin:0!important}body.om-app #dashboardSidebar.mobile-open,body.om-app .dashboard-sidebar.mobile-open{transform:translate3d(0,0,0)!important}}</style>
  <link rel="icon" type="image/png" href="/assets/favicon-192.png?v=20260924-pwa" />
  <link rel="icon" href="/favicon.ico?v=20260924-pwa" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png?v=20260924-pwa" />
  <link rel="stylesheet" href="styles.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="design-system.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="mobile-design-system.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="crm-shared-nav.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="crm-toast.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="crm-shell.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="crm-pwa-install.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="crm-module-panel.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="obramate-app.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="invoices-module.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="om-gestures.css?v=20261008-modulos1" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/om-stable-viewport.css?v=20261007-stable1" id="om-stable-viewport-css" />
</head>
<body class="dashboard-app-body om-app sidebar-collapsed inv-body">
  <script>
    (function () {
      try {
        if (localStorage.getItem("crm_sidebar_collapsed") === "0") {
          document.body.classList.remove("sidebar-collapsed");
        }
      } catch (e) {}
    })();
  </script>

  <header class="mobile-app-header" id="mobileAppHeader">
    <button type="button" class="mobile-app-header__menu" id="mobileMenuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="dashboardSidebar">
      <span class="mobile-app-header__menu-icon" aria-hidden="true"></span>
    </button>
    <div class="mobile-app-header__brand">
      <img src="/assets/obramate-logo.png" alt="ObraMate" class="mobile-app-header__logo crm-system-logo" width="28" height="28" onerror="this.style.display='none'" />
      <h1 class="mobile-app-header__title">Faturas</h1>
    </div>
  </header>

  <div class="dashboard-container">
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <img src="/assets/favicon-192.png?v=20260924-pwa" alt="ObraMate" class="sidebar-brand-logo crm-system-logo" width="32" height="32" onerror="this.style.display='none'" />
        <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-pressed="true" aria-label="Expandir menu lateral" title="Expandir menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="Principal">
        <div id="crmSharedNavRoot" data-layout="sidebar"></div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-bar">
          <div class="sidebar-user-bar__avatar" id="sidebarUserAvatar" aria-hidden="true">—</div>
          <div class="sidebar-user-bar__text">
            <span class="sidebar-user-bar__name" id="sidebarUserName">—</span>
            <span class="sidebar-user-bar__role" id="sidebarUserRole"></span>
          </div>
          <button type="button" id="logoutBtn" class="sidebar-logout-btn" title="Sair" aria-label="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <main class="dashboard-main">
      <div class="inv-page">
        <header class="inv-list-head">
          <div>
            <h2>Faturas</h2>
            <p id="invListSub">Cobranças emitidas a partir dos orçamentos aprovados.</p>
          </div>
          <button type="button" class="inv-btn inv-btn--primary" id="btnNewInvoice" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Nova fatura
          </button>
        </header>

        <div class="inv-kpis" id="invKpis">
          <button type="button" class="inv-kpi" data-tab="unpaid"><span>Em aberto</span><strong id="kpiOutstanding">—</strong><small id="kpiOutstandingN"></small></button>
          <button type="button" class="inv-kpi inv-kpi--overdue" data-tab="overdue"><span>Vencidas</span><strong id="kpiOverdue">—</strong><small id="kpiOverdueN"></small></button>
          <button type="button" class="inv-kpi" data-tab="paid"><span>Recebido · 30 dias</span><strong id="kpiReceived">—</strong><small>pagamentos registrados</small></button>
          <button type="button" class="inv-kpi" data-tab="draft"><span>Rascunhos</span><strong id="kpiDraft">—</strong><small id="kpiDraftN"></small></button>
        </div>

        <nav class="inv-tabs" role="tablist" aria-label="Filtrar por status" id="invTabs">
          <button type="button" class="inv-tab is-active" role="tab" data-tab="all" aria-selected="true">Todas <em data-count="all"></em></button>
          <button type="button" class="inv-tab" role="tab" data-tab="unpaid" aria-selected="false">Em aberto <em data-count="unpaid"></em></button>
          <button type="button" class="inv-tab" role="tab" data-tab="overdue" aria-selected="false">Vencidas <em data-count="overdue"></em></button>
          <button type="button" class="inv-tab" role="tab" data-tab="partially_paid" aria-selected="false">Parciais <em data-count="partially_paid"></em></button>
          <button type="button" class="inv-tab" role="tab" data-tab="paid" aria-selected="false">Pagas <em data-count="paid"></em></button>
          <button type="button" class="inv-tab" role="tab" data-tab="draft" aria-selected="false">Rascunhos <em data-count="draft"></em></button>
          <button type="button" class="inv-tab" role="tab" data-tab="void" aria-selected="false">Anuladas</button>
        </nav>

        <div class="inv-toolbar">
          <label class="inv-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="filterQ" placeholder="Buscar fatura, orçamento ou cliente…" autocomplete="off" aria-label="Buscar faturas" />
          </label>
        </div>

        <div class="om-ptr" id="invPtr" aria-hidden="true">↓ Puxe para atualizar</div>

        <div class="inv-table om-dock-pad" role="table" aria-label="Faturas">
          <div class="inv-trow inv-trow--head" role="row">
            <span role="columnheader">Cliente</span>
            <span role="columnheader">Fatura</span>
            <span role="columnheader">Recebido</span>
            <span role="columnheader">Vencimento</span>
            <span role="columnheader">Status</span>
            <span role="columnheader" style="text-align:right">Saldo / total</span>
          </div>
          <div id="invRows"><div class="inv-table-empty">A carregar…</div></div>
        </div>

        <div class="inv-pager">
          <span id="pageInfo"></span>
          <div>
            <button type="button" class="inv-btn inv-btn--secondary" id="btnPrevPage">Anterior</button>
            <button type="button" class="inv-btn inv-btn--secondary" id="btnNextPage">Seguinte</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Nova fatura -->
  <div class="inv-modal" id="newModal" role="dialog" aria-modal="true" aria-labelledby="newTitle" hidden>
    <div class="inv-modal__backdrop" data-close></div>
    <form class="inv-modal__panel" id="newForm" novalidate>
      <header class="inv-modal__head">
        <div><h3 id="newTitle">Nova fatura</h3><p class="inv-modal__sub">Escolha um job ou um orçamento aprovado com valor a faturar.</p></div>
        <button type="button" class="inv-x" data-close aria-label="Fechar">×</button>
      </header>
      <div class="inv-modal__body">
        <label class="inv-search" style="max-width:none">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="search" id="newQ" placeholder="Buscar job, orçamento ou cliente…" autocomplete="off" />
        </label>
        <div class="inv-pick" id="newPick"><p class="inv-empty">A carregar…</p></div>
        <div id="newKindBox" hidden style="display:grid;gap:12px">
          <fieldset class="inv-field">
            <legend>O que cobrar</legend>
            <div class="inv-kind">
              <label class="inv-seg__opt"><input type="radio" name="newKind" value="deposit" checked /><span><b>Depósito</b><small>% do total</small></span></label>
              <label class="inv-seg__opt"><input type="radio" name="newKind" value="final" /><span><b>Saldo restante</b><small id="newRemainingHint"></small></span></label>
              <label class="inv-seg__opt"><input type="radio" name="newKind" value="progress" /><span><b>Parcela</b><small>valor livre</small></span></label>
              <label class="inv-seg__opt" id="newFullOpt"><input type="radio" name="newKind" value="full" /><span><b>Valor total</b><small>100% de uma vez</small></span></label>
            </div>
          </fieldset>
          <div class="inv-row2">
            <label class="inv-field" id="newPctWrap"><span>Percentual</span><div class="inv-money-input"><input type="number" id="newPct" min="1" max="100" step="1" value="50" /><span style="padding-right:11px">%</span></div></label>
            <label class="inv-field" id="newAmtWrap" hidden><span>Valor</span><div class="inv-money-input"><span>$</span><input type="number" id="newAmt" min="0.01" step="0.01" /></div></label>
            <label class="inv-field"><span>Vencimento</span><input type="date" id="newDue" /></label>
          </div>
          <p class="inv-after" id="newPreview"></p>
        </div>
        <p class="inv-form-error" id="newError" role="alert" hidden></p>
      </div>
      <footer class="inv-modal__foot">
        <button type="button" class="inv-btn inv-btn--ghost" data-close>Cancelar</button>
        <button type="submit" class="inv-btn inv-btn--primary" id="newSubmit" disabled>Criar fatura</button>
      </footer>
    </form>
  </div>

  <script src="crm-toast.js"></script>
  <script src="crm-i18n.js?v=20261001-refresh1"></script>
  <script src="saas-branding.js"></script>
  <script src="crm-shared-nav.js?v=20261008-neutro1"></script>
  <script src="crm-shell.js?v=20261008-name1"></script>
  <script src="om-gestures.js?v=20261002-gest1"></script>
  <script src="invoices-page.js?v=20261008-invname2"></script>
</body>
</html>
