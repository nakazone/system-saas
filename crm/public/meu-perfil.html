<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=configuracoes.html#mp-perfil" />
  <title>Meu Perfil — ObraMate</title>
  <script>
    (function () {
      var map = {
        perfil: "mp-perfil",
        idioma: "mp-idioma",
        senha: "mp-senha",
        conta: "mp-conta",
        "mp-perfil": "mp-perfil",
        "mp-idioma": "mp-idioma",
        "mp-senha": "mp-senha",
        "mp-conta": "mp-conta",
      };
      var raw = String(location.hash || "")
        .replace(/^#/, "")
        .toLowerCase()
        .split(/[/?&]/)[0];
      var target = map[raw] || "mp-perfil";
      location.replace("configuracoes.html#" + target);
    })();
  </script>
</head>
<body>
  <p><a href="configuracoes.html#mp-perfil">Ir para Meu Perfil</a></p>
</body>
</html>
