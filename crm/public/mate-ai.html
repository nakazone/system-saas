<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ee" />
  <title>Mate AI | ObraMate</title>
  <link rel="icon" type="image/png" href="/assets/favicon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="design-system.css" />
  <link rel="stylesheet" href="mobile-design-system.css" />
  <link rel="stylesheet" href="crm-shared-nav.css" />
  <link rel="stylesheet" href="crm-shell.css" />
  <link rel="stylesheet" href="obramate-app.css" />
  <link rel="stylesheet" href="om-mobile-nav.css" />
  <link rel="stylesheet" href="mate-face.css?v=20261026-m1" data-mate-face-css />
  <link rel="stylesheet" href="mate-central.css?v=20261026-m1" />
  <link rel="stylesheet" href="mate-panel.css?v=20261026-m1" />
</head>
<body class="dashboard-app-body om-app sidebar-collapsed">
  <header class="mobile-app-header" id="mobileAppHeader">
    <button type="button" class="mobile-app-header__menu" id="mobileMenuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="dashboardSidebar">
      <span class="mobile-app-header__menu-icon" aria-hidden="true"></span>
    </button>
    <div class="mobile-app-header__brand">
      <img src="/assets/obramate-logo.png" alt="ObraMate" class="mobile-app-header__logo crm-system-logo" width="28" height="28" />
      <h1 class="mobile-app-header__title">Mate AI</h1>
    </div>
  </header>

  <div class="dashboard-container">
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <img src="/assets/favicon-192.png" alt="ObraMate" class="sidebar-brand-logo crm-system-logo" width="32" height="32" />
        <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-pressed="true" aria-label="Expandir menu lateral" title="Expandir menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="Principal">
        <div id="crmSharedNavRoot" data-layout="sidebar"></div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-bar">
          <div class="sidebar-user-bar__avatar" id="sidebarUserAvatar" aria-hidden="true">—</div>
          <div class="sidebar-user-bar__text">
            <span class="sidebar-user-bar__name" id="sidebarUserName">—</span>
            <span class="sidebar-user-bar__role" id="sidebarUserRole"></span>
          </div>
          <button type="button" id="logoutBtn" class="sidebar-logout-btn" title="Sair" aria-label="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <main class="dashboard-main">
      <div class="mc-page" id="mateCentral">
        <header class="mc-head">
          <img class="mc-head__mate" src="/assets/img/mascot/mate-tablet.webp?v=20261026-m1" alt="" height="96" decoding="async" />
          <h1>Mate AI</h1>
          <p>Peça, acompanhe o que o Mate fez e encontre conversas antigas. Em qualquer tela: <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>J</kbd>.</p>
        </header>
        <nav class="mc-tabs" role="tablist" aria-label="Seções do Mate AI">
          <button type="button" role="tab" class="mc-tab is-on" data-tab="pedir" aria-selected="true">Pedir</button>
          <button type="button" role="tab" class="mc-tab" data-tab="conversas" aria-selected="false">Conversas</button>
          <button type="button" role="tab" class="mc-tab" data-tab="ajustes" aria-selected="false">Resumo</button>
        </nav>
        <div class="mc-grid">
          <aside class="mc-col mc-col--convs" data-panel="conversas" aria-label="Conversas">
            <div class="mc-box">
              <div class="mc-box__head">
                <h2>Conversas</h2>
                <button type="button" class="mc-link" id="mcNew">Nova</button>
              </div>
              <input type="search" class="mc-search" id="mcQ" placeholder="Buscar nas conversas" autocomplete="off" />
              <div class="mc-convs" id="mcConvs"><p class="mc-empty">Carregando…</p></div>
            </div>
          </aside>
          <section class="mc-col mc-col--main" data-panel="pedir" aria-label="Pedir ao Mate">
            <div id="mateAiInline"></div>
            <div class="mc-box mc-done">
              <div class="mc-box__head">
                <h2>O que o Mate fez</h2>
                <span class="mc-sub">últimos 2 dias</span>
              </div>
              <div id="mcActivity"><p class="mc-empty">Carregando…</p></div>
            </div>
          </section>
          <aside class="mc-col mc-col--side" data-panel="ajustes" aria-label="Resumo diário">
            <div class="mc-box">
              <div class="mc-box__head mc-box__head--mate"><span class="mate-face mate-face--lg" aria-hidden="true"><img src="/assets/img/mascot/mate-head-neutral.webp?v=20261026-m1" alt="" width="40" height="40" /></span><h2>Resumo diário</h2></div>
              <form class="mc-brief" id="mcBrief">
                <label class="mc-switch"><input type="checkbox" name="enabled" /> <span>Receber o resumo do dia</span></label>
                <div class="mc-brief__row">
                  <label>Hora
                    <select name="hour" id="mcHour"></select>
                  </label>
                </div>
                <fieldset class="mc-brief__ch">
                  <legend>Por</legend>
                  <label><input type="checkbox" name="push" /> Notificação</label>
                  <label><input type="checkbox" name="email" /> E-mail</label>
                </fieldset>
                <p class="mc-brief__msg" id="mcBriefMsg" aria-live="polite"></p>
              </form>
              <details class="mc-today" id="mcToday">
                <summary>Ver o de hoje</summary>
                <ul id="mcTodayList"></ul>
              </details>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script src="crm-toast.js"></script>
  <script src="crm-i18n.js"></script>
  <script src="saas-branding.js"></script>
  <script src="crm-shared-nav.js?v=20261019-mateai1"></script>
  <script src="crm-shell.js"></script>
  <script src="om-mobile-nav.js"></script>
  <script src="mate-face.js?v=20261026-m1"></script>
  <script src="mate-panel.js?v=20261026-m1"></script>
  <script src="mate-central.js?v=20261026-m1"></script>
</body>
</html>
