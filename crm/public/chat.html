<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ee" />
  <title>ObraChat | ObraMate</title>

  <link rel="icon" type="image/png" href="/assets/favicon-192.png?v=20260924-pwa" />
  <link rel="icon" href="/favicon.ico?v=20260924-pwa" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png?v=20260924-pwa" />
  <link rel="stylesheet" href="styles.css?v=20260923-chrome" />
  <link rel="stylesheet" href="design-system.css?v=20260930-maismob2" />

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="om-device.js?v=20261007-stable1"></script>
  <script src="crm-field-gate.js?v=20260928-chat1"></script>

</head>
<body class="dashboard-app-body om-app sidebar-collapsed chat-app">
  <script>
    (function () {
      try {
        if (localStorage.getItem("crm_sidebar_collapsed") === "0") {
          document.body.classList.remove("sidebar-collapsed");
        }
      } catch (e) {}
      if (window.__omDevice && window.__omDevice.applyBodyClass) window.__omDevice.applyBodyClass();
    })();
  </script>

  <header class="mobile-app-header" id="mobileAppHeader">
    <button type="button" class="mobile-app-header__menu" id="mobileMenuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="dashboardSidebar">
      <span class="mobile-app-header__menu-icon" aria-hidden="true"></span>
    </button>
    <div class="mobile-app-header__brand">
      <img src="/assets/obramate-logo.png" alt="ObraMate" class="mobile-app-header__logo crm-system-logo" width="28" height="28" onerror="this.style.display='none'" />
      <h1 class="mobile-app-header__title">ObraChat</h1>
    </div>
  </header>

  <div class="dashboard-container">
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <img src="/assets/favicon-192.png?v=20260924-pwa" alt="ObraMate" class="sidebar-brand-logo crm-system-logo" width="32" height="32" onerror="this.style.display='none'" />
        <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-pressed="true" aria-label="Expandir menu lateral" title="Expandir menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="Principal">
        <div id="crmSharedNavRoot" data-layout="sidebar"></div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-bar">
          <div class="sidebar-user-bar__avatar" id="sidebarUserAvatar" aria-hidden="true">—</div>
          <div class="sidebar-user-bar__text">
            <span class="sidebar-user-bar__name" id="sidebarUserName">—</span>
            <span class="sidebar-user-bar__role" id="sidebarUserRole"></span>
          </div>
          <button type="button" id="logoutBtn" class="sidebar-logout-btn" title="Sair" aria-label="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <main class="dashboard-main chat-main">
      <div class="chat-shell" id="chatShell">
        <!-- Left: conversation list -->
        <aside class="chat-list-pane" id="chatListPane" aria-label="Conversas">
          <header class="chat-list-head">
            <div class="chat-list-head__top">
              <h1 class="chat-list-title">ObraChat</h1>
              <div class="chat-list-actions">
                <button type="button" class="chat-icon-btn" id="chatMentionsBtn" title="Minhas menções" aria-label="Minhas menções">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 006 0v-1a10 10 0 10-3.92 7.94"/></svg>
                  <span class="chat-icon-btn__badge" id="chatMentionsBadge" hidden></span>
                </button>
                <button type="button" class="chat-icon-btn" id="chatNewDmBtn" title="Nova conversa" aria-label="Nova conversa direta">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/><path d="M12 8v6M9 11h6"/></svg>
                </button>
                <button type="button" class="chat-icon-btn" id="chatNewGroupBtn" title="Novo grupo" aria-label="Novo grupo">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 11h-6M20 8v6"/></svg>
                </button>
              </div>
            </div>
            <label class="chat-search">
              <span class="visually-hidden">Buscar</span>
              <svg class="chat-search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input type="search" id="chatListSearch" placeholder="Buscar conversas…" autocomplete="off" />
            </label>
            <div class="chat-list-tabs" role="tablist">
              <button type="button" class="chat-list-tab is-active" data-filter="all" role="tab">Todas</button>
              <button type="button" class="chat-list-tab" data-filter="unread" role="tab">Não lidas</button>
              <button type="button" class="chat-list-tab" data-filter="job" role="tab">Jobs</button>
              <button type="button" class="chat-list-tab" data-filter="group" role="tab">Grupos</button>
              <button type="button" class="chat-list-tab" data-filter="dm" role="tab">Diretas</button>
            </div>
          </header>
          <div class="chat-list-scroll" id="chatListScroll">
            <p class="chat-empty" id="chatListEmpty">Carregando…</p>
            <div id="chatListSections" hidden></div>
          </div>
        </aside>

        <!-- Right: thread -->
        <section class="chat-thread-pane" id="chatThreadPane" aria-label="Conversa">
          <div class="chat-thread-empty" id="chatThreadEmpty">
            <div class="chat-thread-empty__card">
              <span class="chat-thread-empty__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" fill="none" stroke="currentColor" stroke-width="1.75"/></svg>
              </span>
              <p class="chat-thread-empty__title">ObraChat</p>
              <p>Escolha uma conversa à esquerda ou inicie uma nova.</p>
            </div>
          </div>

          <div class="chat-thread" id="chatThread" hidden>
            <header class="chat-thread-head">
              <button type="button" class="chat-back-btn" id="chatBackBtn" aria-label="Voltar às conversas">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
              </button>
              <div class="chat-thread-head__meta">
                <h2 class="chat-thread-title" id="chatThreadTitle">—</h2>
                <p class="chat-thread-sub" id="chatThreadSub"></p>
              </div>
              <div class="chat-thread-head__actions">
                <button type="button" class="chat-icon-btn" id="chatMuteBtn" title="Silenciar" aria-label="Silenciar conversa">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
                </button>
              </div>
            </header>

            <div class="chat-typing" id="chatTyping" hidden></div>

            <div class="chat-messages" id="chatMessages" tabindex="0">
              <button type="button" class="chat-load-older" id="chatLoadOlder" hidden>Carregar mensagens anteriores</button>
              <div id="chatMessagesInner"></div>
            </div>

            <div class="chat-context-chip" id="chatContextChip" hidden>
              <span>Falando sobre: <strong id="chatContextLabel"></strong></span>
              <button type="button" id="chatContextClear" aria-label="Remover contexto do Job">✕</button>
            </div>

            <div class="chat-composer" id="chatComposer">
              <div class="chat-ac" id="chatAc" hidden role="listbox"></div>
              <div class="chat-pending-files" id="chatPendingFiles" hidden></div>
              <div class="chat-composer__row">
                <button type="button" class="chat-icon-btn chat-attach-btn" id="chatAttachBtn" title="Anexar" aria-label="Anexar arquivo">
                  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <button type="button" class="chat-icon-btn chat-camera-btn" id="chatCameraBtn" title="Câmera" aria-label="Tirar foto">
                  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </button>
                <textarea id="chatInput" rows="1" placeholder="Mensagem… (@ menção, / obra)" autocomplete="off" enterkeyhint="send"></textarea>
                <button type="button" class="chat-send-btn" id="chatSendBtn" aria-label="Enviar">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
              </div>
              <input type="file" id="chatFileInput" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" multiple hidden />
              <input type="file" id="chatCameraInput" accept="image/*" capture="environment" hidden />
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- New DM modal -->
  <div class="chat-modal" id="chatDmModal" hidden>
    <div class="chat-modal__backdrop" data-close></div>
    <div class="chat-modal__panel" role="dialog" aria-labelledby="chatDmTitle">
      <header class="chat-modal__head">
        <h3 id="chatDmTitle">Nova conversa</h3>
        <button type="button" class="chat-icon-btn" data-close aria-label="Fechar">✕</button>
      </header>
      <input type="search" id="chatDmSearch" class="chat-modal__search" placeholder="Buscar funcionário…" />
      <div class="chat-modal__list" id="chatDmList"></div>
    </div>
  </div>

  <!-- New group modal -->
  <div class="chat-modal" id="chatGroupModal" hidden>
    <div class="chat-modal__backdrop" data-close></div>
    <div class="chat-modal__panel" role="dialog" aria-labelledby="chatGroupTitle">
      <header class="chat-modal__head">
        <h3 id="chatGroupTitle">Novo grupo</h3>
        <button type="button" class="chat-icon-btn" data-close aria-label="Fechar">✕</button>
      </header>
      <label class="chat-modal__field">
        Nome do grupo
        <input type="text" id="chatGroupName" maxlength="120" placeholder="Ex.: Equipe logística" />
      </label>
      <input type="search" id="chatGroupSearch" class="chat-modal__search" placeholder="Adicionar membros…" />
      <div class="chat-modal__list" id="chatGroupList"></div>
      <footer class="chat-modal__foot">
        <button type="button" class="btn btn-secondary" data-close>Cancelar</button>
        <button type="button" class="btn btn-primary" id="chatGroupCreate">Criar grupo</button>
      </footer>
    </div>
  </div>

  <!-- Mentions panel -->
  <div class="chat-modal" id="chatMentionsModal" hidden>
    <div class="chat-modal__backdrop" data-close></div>
    <div class="chat-modal__panel chat-modal__panel--wide" role="dialog" aria-labelledby="chatMentionsTitle">
      <header class="chat-modal__head">
        <h3 id="chatMentionsTitle">Minhas menções</h3>
        <button type="button" class="chat-icon-btn" data-close aria-label="Fechar">✕</button>
      </header>
      <div class="chat-mentions-toolbar">
        <button type="button" class="btn btn-secondary" id="chatMentionsUnreadOnly">Mostrar todas</button>
        <button type="button" class="btn btn-secondary" id="chatMentionsReadAll">Marcar todas como lidas</button>
      </div>
      <div class="chat-modal__list chat-mentions-list" id="chatMentionsList"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script src="crm-i18n.js?v=20261001-refresh1"></script>
  <script src="crm-shared-nav.js?v=20261007-nav2"></script>
  <script src="crm-shell.js?v=20261008-name1"></script>
  <script src="crm-account-menu.js?v=20261001-refresh1"></script>
  <script src="crm-toast.js"></script>
  <script src="saas-branding.js?v=20260929-navia1"></script>
  <script src="om-mobile-nav.js?v=20261007-nav2"></script>
  <script src="chat-realtime.js?v=20260928-chat1"></script>
  <script src="chat.js?v=20261008-chat7"></script>
</body>
</html>
