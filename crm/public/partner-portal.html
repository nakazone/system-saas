<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>Portal do builder · ObraMate</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="partner-portal-v2.css?v=20261026-pp5" />
</head>
<body class="pp">
  <header class="pp-top">
    <div class="pp-top-in">
      <a class="pp-brand" href="#inicio" aria-label="Início do portal">
        <span class="pp-mark" id="ppMark" aria-hidden="true">·</span>
        <span class="pp-brand-text"><strong id="ppProvider">Carregando…</strong><span>Portal do builder</span></span>
      </a>
      <label class="pp-search" for="ppSearch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <span class="pp-sr">Buscar</span>
        <input id="ppSearch" type="search" autocomplete="off" placeholder="Buscar jobs, endereços, invoices…" />
        <span class="pp-kbd" aria-hidden="true">⌘K</span>
      </label>
      <div class="pp-top-actions">
        <a class="pp-btn pp-btn--pri pp-send-top" href="#enviar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Enviar trabalho
        </a>
        <a class="pp-ibtn pp-plus-mobile" href="#enviar" aria-label="Enviar trabalho">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round"><path d="M12 5v14M5 12h14"/></svg>
        </a>
        <button type="button" class="pp-ibtn pp-avatar" id="ppAvatar" aria-haspopup="true" aria-expanded="false" aria-controls="ppMenu">··</button>
        <div class="pp-menu" id="ppMenu" hidden>
          <div class="pp-menu-head"><strong id="ppUserName"></strong><span id="ppUserEmail"></span></div>
          <div id="ppProviderTools" hidden>
            <label for="ppProviderSelect">Fornecedor</label>
            <select id="ppProviderSelect"></select>
            <button type="button" class="pp-menu-item" id="ppProviderSwitch">Trocar de fornecedor</button>
          </div>
          <button type="button" class="pp-menu-item" id="ppLogout">Sair</button>
        </div>
      </div>
    </div>
  </header>

  <main class="pp-wrap" id="ppView" aria-live="polite">
    <div class="pp-empty"><strong>Carregando o portal…</strong></div>
  </main>

  <nav class="pp-dock" id="ppDock" aria-label="Navegação" hidden>
    <a class="pp-di" href="#inicio" data-nav="inicio"><span class="pp-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>Início</a>
    <span class="pp-sep" aria-hidden="true"></span>
    <a class="pp-di" href="#jobs" data-nav="jobs"><span class="pp-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v12H4z"/><path d="M9 8V5h6v3"/></svg></span>Jobs</a>
    <a class="pp-di" href="#calendario" data-nav="calendario"><span class="pp-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4z"/><path d="M8 3v5M16 3v5M4 11h16"/></svg></span>Calendário</a>
    <a class="pp-di" href="#documentos" data-nav="documentos"><span class="pp-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>Fotos e docs</a>
    <span class="pp-sep" aria-hidden="true"></span>
    <a class="pp-di" href="#invoices" data-nav="invoices"><span class="pp-count" data-count="invoices" hidden></span><span class="pp-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>Invoices</a>
    <a class="pp-di" href="#enviar" data-nav="enviar"><span class="pp-count" data-count="pedidos" hidden></span><span class="pp-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>Pedidos</a>
  </nav>

  <nav class="pp-tabs" id="ppTabs" aria-label="Abas" hidden>
    <a class="pp-tab" href="#inicio" data-nav="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Início</a>
    <a class="pp-tab" href="#jobs" data-nav="jobs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v12H4z"/><path d="M9 8V5h6v3"/></svg>Jobs</a>
    <a class="pp-tab" href="#calendario" data-nav="calendario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4z"/><path d="M8 3v5M16 3v5M4 11h16"/></svg>Calendário</a>
    <a class="pp-tab" href="#invoices" data-nav="invoices"><span class="pp-count" data-count="invoices" hidden></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Invoices</a>
    <a class="pp-tab" href="#mais" data-nav="mais"><span class="pp-count" data-count="pedidos" hidden></span><svg viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>Mais</a>
  </nav>
  <button type="button" class="pp-search-fab" id="ppSearchFab" aria-label="Buscar" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  </button>
  <div class="pp-search-sheet" id="ppSearchSheet" hidden>
    <div style="display:flex;gap:10px;align-items:center">
      <label class="pp-search" for="ppSearchMobile" style="flex:1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <span class="pp-sr">Buscar</span>
        <input id="ppSearchMobile" type="search" autocomplete="off" placeholder="Jobs, endereços, invoices…" />
      </label>
      <button type="button" class="pp-link" id="ppSearchClose" style="text-decoration:none">Cancelar</button>
    </div>
    <div id="ppSearchResults" class="pp-card" style="overflow:hidden"></div>
  </div>

  <input type="file" id="ppFileInput" accept="image/jpeg,image/png,image/webp,application/pdf" multiple hidden />
  <input type="file" id="ppCameraInput" accept="image/*" capture="environment" hidden />
  <script src="partner-portal.js?v=20261026-pp5" defer></script>
</body>
</html>
