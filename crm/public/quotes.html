<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />

  <title>Orçamentos | ObraMate</title>
  <style id="om-chrome-critical">html{--plab-rail:72px;--crm-sidebar-expanded-width:232px}body.om-app.dashboard-app-body{--crm-topbar-height:56px;--crm-sidebar-width:var(--crm-sidebar-expanded-width,232px)}body.om-app.dashboard-app-body.sidebar-collapsed{--crm-sidebar-width:72px}@media (min-width:1025px){body.om-app .dashboard-container{display:block!important;margin-left:var(--crm-sidebar-width,72px)!important;margin-top:var(--crm-topbar-height)!important;width:auto}body.om-app #dashboardSidebar,body.om-app .dashboard-sidebar{position:fixed!important;inset:0 auto 0 0!important;top:0!important;left:0!important;width:var(--crm-sidebar-width,72px)!important;min-width:var(--crm-sidebar-width,72px)!important;max-width:var(--crm-sidebar-width,72px)!important;height:100vh!important;margin:0!important;transform:none!important;transition:none!important;z-index:40}body.om-app.sidebar-collapsed #dashboardSidebar,body.om-app.sidebar-collapsed .dashboard-sidebar{overflow:visible!important}body.om-app .dashboard-main{margin-left:0!important;margin-top:var(--crm-topbar-height)!important;display:flex!important;flex-direction:column!important;transition:none!important;padding-bottom:6.5rem!important}body.om-app .dashboard-sidebar,body.om-app .dashboard-container{transition:none!important}body.om-app.sidebar-collapsed .nav-item__label,body.om-app.sidebar-collapsed .sidebar-user-bar__text{display:none!important}body.om-app.sidebar-collapsed .sidebar-nav-group-label{visibility:hidden!important}}/*maismob2*/@media (max-width:1024px){body.om-app.dashboard-app-body,body.om-app{--crm-sidebar-width:0px!important}body.om-app .dashboard-container{display:block!important;margin:0!important;width:100%!important;max-width:100%!important}body.om-app .dashboard-main,body.om-app.dashboard-app-body .dashboard-main,body.om-app.sidebar-collapsed .dashboard-main{margin:0!important;margin-left:0!important;margin-top:0!important;width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important}body.om-app #dashboardSidebar,body.om-app .dashboard-sidebar{position:fixed!important;left:0!important;top:0!important;height:100vh!important;height:100dvh!important;width:min(288px,92vw)!important;min-width:0!important;max-width:min(288px,92vw)!important;transform:translate3d(-105%,0,0)!important;z-index:1100!important;margin:0!important}body.om-app #dashboardSidebar.mobile-open,body.om-app .dashboard-sidebar.mobile-open{transform:translate3d(0,0,0)!important}}</style>
  <link rel="icon" type="image/png" href="/assets/favicon-192.png?v=20260924-pwa" />
  <link rel="icon" href="/favicon.ico?v=20260924-pwa" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png?v=20260924-pwa" />
  <link rel="stylesheet" href="styles.css?v=20261008-modulos1" />

  <link rel="stylesheet" href="crm-shell.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="crm-pwa-install.css?v=20261008-modulos1" />

</head>
<body class="dashboard-app-body om-app sidebar-collapsed quotes-app">
  <script src="om-device.js?v=20261007-stable1"></script>
  <script>
    (function () {
      try {
        if (localStorage.getItem("crm_sidebar_collapsed") === "0") {
          document.body.classList.remove("sidebar-collapsed");
        }
      } catch (e) {}
      if (window.__omDevice && window.__omDevice.applyBodyClass) window.__omDevice.applyBodyClass();
    })();
  </script>

  <header class="mobile-app-header" id="mobileAppHeader">
    <button type="button" class="mobile-app-header__menu" id="mobileMenuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="dashboardSidebar">
      <span class="mobile-app-header__menu-icon" aria-hidden="true"></span>
    </button>
    <div class="mobile-app-header__brand">
      <img src="/assets/obramate-logo.png" alt="ObraMate" class="mobile-app-header__logo crm-system-logo" width="28" height="28" onerror="this.style.display='none'" />
      <h1 class="mobile-app-header__title">Orçamentos</h1>
    </div>
  </header>

  <div class="dashboard-container">
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <img src="/assets/favicon-192.png?v=20260924-pwa" alt="ObraMate" class="sidebar-brand-logo crm-system-logo" width="32" height="32" onerror="this.style.display='none'" />
        <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-pressed="true" aria-label="Expandir menu lateral" title="Expandir menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="Principal">
        <div id="crmSharedNavRoot" data-layout="sidebar"></div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-bar">
          <div class="sidebar-user-bar__avatar" id="sidebarUserAvatar" aria-hidden="true">—</div>
          <div class="sidebar-user-bar__text">
            <span class="sidebar-user-bar__name" id="sidebarUserName">—</span>
            <span class="sidebar-user-bar__role" id="sidebarUserRole"></span>
          </div>
          <button type="button" id="logoutBtn" class="sidebar-logout-btn" title="Sair" aria-label="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <main class="dashboard-main">
      <div class="qx crm-page" id="qxRoot">
        <header class="qx-head">
          <h1>Quotes</h1>
          <dl class="qx-sum" aria-label="Resumo">
            <div><dt>Em aberto</dt><dd id="qxSumOpen">—</dd></div>
            <div><dt>Aprovação · 90 dias</dt><dd id="qxSumRate">—</dd></div>
            <div><dt>Ticket médio</dt><dd id="qxSumTicket">—</dd></div>
            <div><dt>Vencem em 7 dias</dt><dd id="qxSumExpiring">—</dd></div>
          </dl>
          <div class="qx-head__acts">
            <a class="qx-btn" href="quote-catalog.html" data-crm-permission="quotes.edit"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8" r="1.4"/></svg>Catálogo</a>
            <a class="qx-btn qx-btn--pri" href="quote-builder.html" data-crm-permission="quotes.edit"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Novo quote</a>
          </div>
        </header>

        <nav class="qx-groups" id="qxGroups" aria-label="Status"></nav>

        <div class="qx-tool">
          <label class="qx-search">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="filterQ" placeholder="Buscar cliente, endereço ou nº" autocomplete="off" aria-label="Buscar quotes" />
          </label>
          <span class="qx-tool__sp"></span>
          <span class="qx-count" id="quotesResultCount"></span>
          <button type="button" class="qx-chip" id="qxArchived" aria-pressed="false">Arquivados</button>
        </div>

        <div class="om-ptr" id="quotesPtr" aria-hidden="true">↓ Puxe para atualizar</div>
        <div class="qx-table">
          <div class="qx-row qx-row--head" aria-hidden="true">
            <span>Cliente</span><span>Status</span><span>Valor</span><span>Próximo passo</span><span>Validade</span><span></span>
          </div>
          <div id="quotesTableBody" role="list">
            <p class="qx-empty">Carregando…</p>
          </div>
        </div>

        <div class="qx-pages" id="qxPages" hidden>
          <button type="button" class="qx-btn" id="btnPrevPage">Anterior</button>
          <span id="pageInfo">Página 1</span>
          <button type="button" class="qx-btn" id="btnNextPage">Próxima</button>
        </div>
      </div>
    </main>
  </div>

  <script src="crm-toast.js"></script>
  <script src="crm-i18n.js?v=20261001-refresh1"></script>
  <script src="saas-branding.js"></script>
  <script src="crm-shared-nav.js?v=20261009-cx1"></script>
  <script src="crm-shell.js?v=20261009-cx1"></script>
  <script src="om-mobile-nav.js?v=20261008-neutro1"></script>
  <script src="om-gestures.js?v=20261002-gest1"></script>
  <script src="lead-signals.js?v=20261009-lb1"></script>
  <script src="quotes-page.js?v=20261009-qx1"></script>
</body>
</html>
