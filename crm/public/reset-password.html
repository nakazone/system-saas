<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#211d1a">
    <meta name="referrer" content="no-referrer">
    <title>ObraMate - Choose a new password</title>
    <link rel="icon" type="image/png" href="/assets/favicon-192.png?v=20260924-pwa" />
    <link rel="icon" href="/favicon.ico?v=20260924-pwa" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/favicon-180.png?v=20260924-pwa" />
    <link rel="stylesheet" href="styles.css?v=20261008-modulos1">
    <link rel="stylesheet" href="design-system.css?v=20261008-modulos1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth-pages.css?v=20261014-pw1">
    <link rel="stylesheet" href="/om-stable-viewport.css?v=20261007-stable1" id="om-stable-viewport-css" />
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <img src="/assets/obramate-logo.png" alt="ObraMate" class="logo-image">
                <h1>Choose a new password</h1>
                <p id="rpIntro">Checking your link…</p>
            </div>

            <form id="rpForm" class="login-form" novalidate hidden>
                <div class="form-group">
                    <label for="pw1">New password</label>
                    <input type="password" id="pw1" required minlength="8" autocomplete="new-password">
                    <small class="ap-muted">At least 8 characters.</small>
                </div>
                <div class="form-group">
                    <label for="pw2">Confirm new password</label>
                    <input type="password" id="pw2" required minlength="8" autocomplete="new-password">
                </div>
                <div id="rpError" class="error-message" role="alert" style="display:none"></div>
                <button type="submit" class="btn btn-primary btn-login-full" id="rpBtn" style="text-align:center">Save new password</button>
            </form>

            <div id="rpDone" class="ap-done" role="status" hidden>
                <div class="ap-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
                <h2>Password changed</h2>
                <p>You were signed out on other devices. Sign in with your new password.</p>
                <a class="btn btn-primary btn-login-full" href="/login.html" id="rpLogin" style="text-align:center;display:block">Sign in</a>
            </div>

            <div id="rpBad" class="ap-done" hidden>
                <h2>This link doesn’t work anymore</h2>
                <p>Reset links work for 1 hour and only once. Ask for a new one.</p>
                <a class="btn btn-primary btn-login-full" href="/forgot-password.html" style="text-align:center;display:block">Send a new link</a>
            </div>

            <div class="login-footer">
                <p class="login-alt"><a href="/login.html">← Back to sign in</a></p>
            </div>
        </div>
    </div>
    <script>
    (function () {
        var token = '';
        try { token = new URLSearchParams(location.search).get('token') || ''; } catch (e) {}
        // Keep the token out of the address bar / history once read.
        try { history.replaceState(null, '', location.pathname); } catch (e) {}
        var intro = document.getElementById('rpIntro');
        var form = document.getElementById('rpForm');
        var err = document.getElementById('rpError');
        var btn = document.getElementById('rpBtn');
        var email = '';
        function bad() { intro.textContent = ''; form.hidden = true; document.getElementById('rpBad').hidden = false; }
        function showErr(t) { err.textContent = t; err.style.display = 'block'; }
        if (!token) { bad(); return; }
        fetch('/api/auth/reset-password?token=' + encodeURIComponent(token), { credentials: 'include' })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (x) {
                if (!x.ok || !x.j.success) return bad();
                email = x.j.data.email;
                intro.textContent = 'For ' + email + ' at ' + x.j.data.organization_name + '.';
                form.hidden = false;
                document.getElementById('pw1').focus();
            })
            .catch(bad);
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            err.style.display = 'none';
            var a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
            if (a.length < 8) return showErr('Use at least 8 characters.');
            if (a !== b) return showErr('The two passwords don’t match.');
            btn.disabled = true; btn.textContent = 'Saving…';
            try {
                var r = await fetch('/api/auth/reset-password', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, password: a }) });
                var j = await r.json().catch(function () { return {}; });
                if (r.status === 410) return bad();
                if (!r.ok) return showErr(j.error || 'Something went wrong. Try again.');
                intro.textContent = ''; form.hidden = true; document.getElementById('rpDone').hidden = false;
                document.getElementById('rpLogin').href = '/login.html?email=' + encodeURIComponent(email);
            } catch (e2) {
                showErr('Could not reach the server. Check your connection.');
            } finally {
                btn.disabled = false; btn.textContent = 'Save new password';
            }
        });
    })();
    </script>
</body>
</html>
