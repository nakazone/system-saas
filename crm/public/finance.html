<html lang="pt-BR">
<head>

ing:border-box!important}body.om-app #dashboardSidebar,body.om-app .dashboard-sidebar{position:fixed!important;left:0!important;top:0!important;height:100vh!important;height:100dvh!important;width:min(288px,92vw)!important;min-width:0!important;max-width:min(288px,92vw)!important;transform:translate3d(-105%,0,0)!important;z-index:1100!important;margin:0!important}body.om-app #dashboardSidebar.mobile-open,body.om-app .dashboard-sidebar.mobile-open{transform:translate3d(0,0,0)!important}}</style>
  <link rel="icon" type="image/png" href="/assets/favicon-192.png?v=20260924-pwa" />
  <link rel="icon" href="/favicon.ico?v=20260924-pwa" sizes="any" />

  <link rel="stylesheet" href="crm-shell.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="crm-module-panel.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="obramate-app.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="om-mobile-nav.css?v=20261008-modulos1" />
  <link rel="stylesheet" href="finance-v2.css?v=20261009-fx1" />

  <script src="om-device.js?v=20261007-stable1"></script>

</head>
<body class="dashboard-app-body om-app sidebar-collapsed fin-app fx-body">
  <script>
    (function () {
      try {
        if (localStorage.getItem("crm_sidebar_collapsed") === "0") {
          document.body.classList.remove("sidebar-collapsed");
        }
      } catch (e) {}
      if (window.__omDevice && window.__omDevice.applyBodyClass) window.__omDevice.applyBodyClass();
    })();
  </script>

  <header class="mobile-app-header" id="mobileAppHeader">
    <button type="button" class="mobile-app-header__menu" id="mobileMenuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="dashboardSidebar">
      <span class="mobile-app-header__menu-icon" aria-hidden="true"></span>
    </button>
    <div class="mobile-app-header__brand">
      <img src="/assets/obramate-logo.png" alt="ObraMate" class="mobile-app-header__logo crm-system-logo" width="28" height="28" onerror="this.style.display='none'" />
      <h1 class="mobile-app-header__title">Fluxo de caixa</h1>
    </div>
  </header>

  <div class="dashboard-container">
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <div class="sidebar-header">
        <img src="/assets/favicon-192.png?v=20260924-pwa" alt="ObraMate" class="sidebar-brand-logo crm-system-logo" width="32" height="32" onerror="this.style.display='none'" />
        <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-pressed="true" aria-label="Expandir menu lateral" title="Expandir menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="Principal">
        <div id="crmSharedNavRoot" data-layout="sidebar"></div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-bar">
          <div class="sidebar-user-bar__avatar" id="sidebarUserAvatar" aria-hidden="true">—</div>
          <div class="sidebar-user-bar__text">
            <span class="sidebar-user-bar__name" id="sidebarUserName">—</span>
            <span class="sidebar-user-bar__role" id="sidebarUserRole"></span>
          </div>
          <button type="button" id="logoutBtn" class="sidebar-logout-btn" title="Sair" aria-label="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <main class="dashboard-main">
      <div class="fx" id="fx">
        <div class="fx-split" id="fxSplit">
          <section class="fx-list" aria-label="Movimentos">
            <div class="fx-list__top">
              <div class="fx-title">
                <h1>Fluxo de caixa</h1>
                <button type="button" class="fx-btn fx-btn--pri fx-btn--sm" id="fxScanBtn" data-crm-permission="finance.manage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Scan</span></button>
                <button type="button" class="fx-btn fx-btn--icon fx-btn--sm" id="fxNewBtn" data-crm-permission="finance.manage" aria-label="Novo custo" title="Novo custo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
              </div>
              <div class="fx-period">
                <div class="fx-month" id="fxMonth">
                  <button type="button" id="fxPrev" aria-label="Período anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
                  <span id="fxPerLabel">—</span>
                  <button type="button" id="fxNext" aria-label="Próximo período"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
                </div>
                <div class="fx-range" id="fxRange" role="group" aria-label="Período">
                  <button type="button" data-range="month" class="is-on">Mês</button>
                  <button type="button" data-range="30">30 dias</button>
                  <button type="button" data-range="year">Ano</button>
                  <button type="button" data-range="custom">Datas</button>
                </div>
              </div>
              <div class="fx-dates" id="fxDates" hidden>
                <label>De<input type="date" id="finFrom" /></label>
                <label>Até<input type="date" id="finTo" /></label>
              </div>
              <div class="fx-phero" id="fxPhero"></div>
              <dl class="fx-sums" id="fxSums"></dl>
              <label class="fx-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="search" id="fxQ" placeholder="Buscar movimento" autocomplete="off" aria-label="Buscar movimento" /></label>
              <div class="fx-seg" id="fxSeg" role="group" aria-label="Filtrar">
                <button type="button" data-f="all" class="is-on">Tudo <em></em></button>
                <button type="button" data-f="in">Entradas <em></em></button>
                <button type="button" data-f="out">Saídas <em></em></button>
                <button type="button" data-f="draft">Revisar <em></em></button>
              </div>
            </div>
            <div class="fx-rows" id="fxRows"><p class="fx-empty">Carregando…</p></div>
          </section>
          <section class="fx-main" id="fxMain">
            <a class="fx-back" href="#" id="fxBack"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Fluxo de caixa</a>
            <div class="fx-pane" id="fxPane"></div>
          </section>
        </div>
      </div>
      <div class="fx-mbar" id="fxMbar" hidden></div>
    </main>
  </div>

  <!-- Novo custo: foto do recibo (scan) ou à mão -->
  <div class="fx-modal" id="fxNewModal" role="dialog" aria-modal="true" aria-labelledby="fxNewTitle" hidden>
    <div class="fx-modal__backdrop" data-fx-close></div>
    <div class="fx-modal__panel">
      <header class="fx-modal__head">
        <div><h2 id="fxNewTitle">Novo custo</h2><p id="fxNewSub">Entra no fluxo de caixa</p></div>
        <button type="button" class="fx-x" data-fx-close aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </header>
      <div class="fx-modal__seg fx-range" id="fxNewMode">
        <button type="button" data-mode="scan" class="is-on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto do recibo</button>
        <button type="button" data-mode="manual">Lançar à mão</button>
      </div>
      <form id="scanForm" class="fx-form" data-mode-pane="scan">
        <div class="fx-modal__body">
          <label class="fx-drop" id="fxDrop">
            <input name="receipt_file" type="file" accept="image/*" capture="environment" />
            <span class="fx-drop__in" id="fxDropIn"><span class="fx-drop__ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><b>Tirar foto ou escolher arquivo</b><small id="scanOcrHint">Valor, fornecedor e data são lidos da foto</small></span>
            <span class="fx-drop__img" id="scanPreview" hidden></span>
          </label>
          <p class="fx-sec">Corrigir antes de ler <span>opcional</span></p>
          <div class="fx-row2">
            <label class="fx-field">Fornecedor<input name="vendor_name" maxlength="120" placeholder="Lido da foto" /></label>
            <label class="fx-field">Valor ($)<input name="amount" type="number" step="0.01" min="0.01" placeholder="Lido da foto" /></label>
          </div>
          <label class="fx-field">Data<input name="incurred_on" type="date" /></label>
          <label class="fx-check"><input type="checkbox" name="force_draft" /><span>Guardar como rascunho (revisar antes de lançar)</span></label>
        </div>
        <footer class="fx-modal__foot">
          <button type="button" class="fx-btn fx-btn--ghost" data-fx-close>Cancelar</button>
          <button type="submit" class="fx-btn fx-btn--pri" id="scanSubmitBtn">Ler e lançar</button>
        </footer>
      </form>
      <form id="costForm" class="fx-form" data-mode-pane="manual" hidden>
        <div class="fx-modal__body">
          <label class="fx-field">Descrição<input name="description" required maxlength="200" placeholder="Ex.: Cola e argamassa" /></label>
          <div class="fx-row2">
            <label class="fx-field">Fornecedor<input name="vendor_name" maxlength="120" /></label>
            <label class="fx-field">Valor ($)<input name="amount" type="number" step="0.01" min="0.01" required /></label>
          </div>
          <label class="fx-field">Data<input name="incurred_on" type="date" required /></label>
          <div class="fx-field">Categoria<div class="fx-cats" data-cat-picker><input type="hidden" name="category" value="other" /></div></div>
          <label class="fx-field"><span>Recibo <span class="fx-opt">opcional</span></span><input name="receipt_file" type="file" accept="image/*,application/pdf" /></label>
          <label class="fx-field"><span>Notas <span class="fx-opt">opcional</span></span><textarea name="notes" rows="2" data-crm-rich="off" placeholder="Só a equipe vê"></textarea></label>
        </div>
        <footer class="fx-modal__foot">
          <button type="button" class="fx-btn fx-btn--ghost" data-fx-close>Cancelar</button>
          <button type="submit" class="fx-btn fx-btn--pri">Salvar custo</button>
        </footer>
      </form>
    </div>
  </div>

  <script src="crm-toast.js"></script>
  <script src="crm-i18n.js?v=20261001-refresh1"></script>
  <script src="saas-branding.js"></script>
  <script src="om-device.js?v=20261007-stable1"></script>
  <script src="crm-shared-nav.js?v=20261009-cx1"></script>
  <script src="crm-shell.js?v=20261009-cx1"></script>
  <script src="om-mobile-nav.js?v=20261008-neutro1"></script>
  <script src="finance.js?v=20261009-fx1"></script>
</body>
</html>
